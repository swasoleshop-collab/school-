function crack(pw){
  if(!pw)return null;
  let cs=0; if(/[a-z]/.test(pw))cs+=26; if(/[A-Z]/.test(pw))cs+=26; if(/[0-9]/.test(pw))cs+=10; if(/[^a-zA-Z0-9]/.test(pw))cs+=33;
  const log10=pw.length*Math.log10(cs), secs=Math.pow(10,log10-10)/2;
  return {secs,cs,len:pw.length,log10};
}
function human(s){
  if(s<1)return 'Instantly'; if(s<60)return Math.round(s)+' seconds'; if(s<3600)return Math.round(s/60)+' minutes'; if(s<86400)return Math.round(s/3600)+' hours';
  if(s<31557600)return Math.round(s/86400)+' days'; const y=s/31557600;
  if(y<1e3)return Math.round(y)+' years'; if(y<1e6)return Math.round(y/1e3)+' thousand years'; if(y<1e9)return (y/1e6).toFixed(1)+' million years'; return 'Billions of years';
}

const MEDS=[[1,'Paracetamol 650','B101','2027-08-31',120,2.10],[2,'Amoxicillin 500','A220','2026-12-31',15,8.50],[3,'Cetirizine 10','C330','2027-03-31',60,1.80],[4,'Pantoprazole 40','P440','2027-01-15',8,6.00],[5,'ORS sachet','O550','2028-02-28',200,21.00]];

const PRESETS=[
 ['See everything','SELECT * FROM medicines;'],
 ['Low stock','SELECT name, qty FROM medicines WHERE qty < 20;'],
 ['Expiring soon',"SELECT name, expiry FROM medicines\nWHERE expiry < '2027-03-31'\nORDER BY expiry;"],

function presetResult(sql){
  const n=sql.replace(/\s+/g,' ').trim().toLowerCase();
  const cols=['med_id','name','batch','expiry','qty','price'];
  const P=PRESETS.map(p=>p[1].replace(/\s+/g,' ').trim().toLowerCase());
  if(n===P[0])return{columns:cols,values:MEDS};
  if(n===P[1])return{columns:['name','qty'],values:MEDS.filter(m=>m[4]<20).map(m=>[m[1],m[4]])};
  if(n===P[2])return{columns:['name','expiry'],values:MEDS.filter(m=>m[3]<'2027-03-31').sort((a,b)=>a[3].localeCompare(b[3])).map(m=>[m[1],m[3]])};
  if(n===P[3])return{columns:['COUNT(*)'],values:[[MEDS.length]]};
  if(n===P[4])return{columns:['stock_value'],values:[[MEDS.reduce((s,m)=>s+m[4]*m[5],0)]]};
  if(n===P[5])return{columns:['name','price'],values:MEDS.filter(m=>m[5]>5).map(m=>[m[1],m[5]])};
  if(n===P[6])return{columns:['name','price'],values:[...MEDS].sort((a,b)=>b[5]-a[5]).map(m=>[m[1],m[5]])};
  return null;
}
let SQLDB=null, sqlState='loading';
async function loadSQL(){
  if(SQLDB||sqlState==='failed')return;
  try{
    if(!window.initSqlJs)throw new Error('no lib');
    const SQL=await window.initSqlJs({locateFile:f=>'https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/'+f});
    SQLDB=new SQL.Database();
    SQLDB.run(`CREATE TABLE medicines(med_id INT PRIMARY KEY, name TEXT NOT NULL, batch TEXT, expiry TEXT, qty INT CHECK(qty>=0), price REAL);
      CREATE TABLE sales(sale_id INT PRIMARY KEY, med_id INT REFERENCES medicines(med_id), sale_date TEXT, qty INT);`);
    const st=SQLDB.prepare('INSERT INTO medicines VALUES (?,?,?,?,?,?)');MEDS.forEach(r=>st.run(r));st.free();
    const s2=SQLDB.prepare('INSERT INTO sales VALUES (?,?,?,?)');SALES.forEach(r=>s2.run(r));s2.free();
    sqlState='ready';
  }catch(e){sqlState='failed'}
  const el=$('sqlstate'); if(el)el.innerHTML=sqlState==='ready'?'<span class="tag good">Live SQL engine ready: type any query</span>':'<span class="tag warn">Offline mode: the example buttons still work</span>';
}
function tableHtml(res){
  if(!res||!res.columns)return '<p class="muted">The query ran. It returned no rows.</p>';

  return `<div class="tablebox"><table><tr>${res.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${res.values.map((r,i)=>`<tr class="new" style="animation-delay:${i*90}ms">${r.map(v=>`<td>${esc(fmt(v))}</td>`).join('')}</tr>`).join('')}</table></div><p class="small muted">${res.values.length} row${res.values.length===1?'':'s'}</p>`;
}
function runSQL(){

  }
}

function pyType(v){
  v=v.trim(); if(!v)return null;
  if(/^(["']).*\1$/.test(v))return ['str','Anything inside quotes is text (str).'];
  if(/^-?\d+$/.test(v))return ['int','A whole number is an int.'];
  if(/^-?(\d+\.\d*|\.\d+)$/.test(v))return ['float','A number with a decimal point is a float.'];
  if(v==='True'||v==='False')return ['bool','True and False (capital letter, no quotes) are bool.'];
  if(v==='true'||v==='false')return [null,'Python is case-sensitive: write True or False with a capital letter.'];
  return [null,'In Python, text needs quotes, like "'+v+'".'];
}
async function traceGrade(){
  const btn=$('grun'); const m=Number($('gm').value); if(!Number.isFinite(m)){toast('Enter a number');return}
  btn.disabled=true; const L=[...document.querySelectorAll('#gcode .l')];
  L.forEach(l=>{l.className='l';const k=l.querySelector('.mark');if(k)k.remove()});
  $('gout').textContent='';
  const mark=(i,t,ok)=>{const s=document.createElement('span');s.className='mark';s.style.color=ok?'#8FE0A8':'#F38A7E';s.textContent=t;L[i].appendChild(s)};
  const hit=async i=>{L[i].classList.add('hit');await sleep(650)};
  await hit(0); mark(0,'marks = '+m,true); L[0].classList.remove('hit');
  const conds=[[1,m>=75,2,'Grade A'],[3,m>=60,4,'Grade B'],[5,m>=33,6,'Grade C - Pass']];
  let printed=null;
  for(const [ci,ok,pi,txt] of conds){
    await hit(ci); mark(ci,ok?'True':'False',ok);
    if(ok){L[ci].classList.remove('hit');await hit(pi);printed=txt;break}
    L[ci].classList.remove('hit'); L[pi].classList.add('skip');
  }
  if(!printed){await hit(7);L[7].classList.remove('hit');await hit(8);printed='Fail'}
  for(let i=0;i<L.length;i++)if(!L[i].classList.contains('hit')&&!L[i].querySelector('.mark')&&i!==0)L[i].classList.add('skip');
  $('gout').textContent=printed; btn.disabled=false; btn.textContent='Run again';
}
function updBill(){
  const p=Number($('bp').value)||0,q=Math.floor(Number($('bq').value)||0); let bill=p*q; const disc=bill>500;
  const L=[...document.querySelectorAll('#bcode .l')]; L.forEach(l=>{l.className='l';const k=l.querySelector('.mark');if(k)k.remove()});
  const mark=(i,t,c)=>{const s=document.createElement('span');s.className='mark';s.style.color=c||'#F4B183';s.textContent=t;L[i].appendChild(s)};
  mark(0,'price = '+p); mark(1,'qty = '+q); mark(2,'bill = '+(+(p*q).toFixed(2)));
  mark(3,disc?'True':'False',disc?'#8FE0A8':'#F38A7E');
  if(disc){bill=bill-bill*0.10;L[4].classList.add('hit');mark(4,'bill = '+(+bill.toFixed(2)))}else L[4].classList.add('skip');
  const shown=Number.isInteger(bill)?bill.toFixed(1):String(+bill.toFixed(2));
  $('bout').textContent='Amount to pay: '+shown+(disc?'   (10% discount applied)':'   (no discount)');
}
function updLoop(){const n=Number($('ln').value);if(!Number.isFinite(n)){$('lout').textContent='';return}$('lout').textContent=Array.from({length:10},(_,i)=>`${n} x ${i+1} = ${n*(i+1)}`).join('\n')}
function initL4(){
  $('tv').addEventListener('input',e=>{const r=pyType(e.target.value);$('tout').textContent=r?(r[0]?`type(${e.target.value.trim()}) → <class '${r[0]}'>\n${r[1]}`:r[1]):"type( … ) will show here"});
  const setTrap=num=>{$('tr-text').classList.toggle('on',!num);$('tr-num').classList.toggle('on',num);$('trcode').textContent=num?'print(int("5") + int("3"))':'print("5" + "3")';$('trout').textContent=num?'8':'53';$('trwhy').textContent=num?'int() turns text into numbers, so + adds them.':'Text + text joins them together.'};
  $('tr-text').addEventListener('click',()=>setTrap(false)); $('tr-num').addEventListener('click',()=>setTrap(true));
  $('grun').addEventListener('click',traceGrade);
  ['bp','bq'].forEach(id=>$(id).addEventListener('input',updBill)); updBill();
  $('ln').addEventListener('input',updLoop); updLoop();
}

function initQuiz(id){
  $('quizform').addEventListener('submit',async e=>{
    e.preventDefault(); const Q=QUIZ[id];
    const name=$('qn').value.trim(); if(!name){toast('Please type your name');return}
    const ans=Q.qs.map((_,i)=>{const r=document.querySelector(`input[name="q${i}"]:checked`);return r?+r.value:-1});
    if(ans.includes(-1)){toast('Answer every question first');return}
    const score=ans.reduce((s,a,i)=>s+(a===Q.qs[i].a?1:0),0);
    const rec={student_name:name,roll_no:$('qr').value.trim(),course:$('qc').value,year:+$('qy').value,lesson:id,score,total:Q.qs.length,answers:ans};
    try{localStorage.setItem('student',JSON.stringify({name,roll:rec.roll_no,course:rec.course,year:rec.year}))}catch(err){}
    $('qsub').disabled=true; $('quizform').querySelectorAll('input,select').forEach(x=>x.disabled=true);
    Q.qs.forEach((q,i)=>{const w=$('w'+i);w.hidden=false;const ok=ans[i]===q.a;w.className='feedback '+(ok?'good':'bad');w.textContent=(ok?'Correct. ':'Answer: '+q.o[q.a]+'. ')+q.why;$('o'+i+'-'+q.a).classList.add('right');if(!ok)$('o'+i+'-'+ans[i]).classList.add('wrong')});
    let note='';
    if(sb){const {error}=await sb.from('quiz_results').insert(rec);note=error?'Your score could not be sent to the teacher. Show this screen to your teacher.':'Your result has been sent to your teacher.'}
    else note='Practice mode: results are not being saved.';
    $('qresult').innerHTML=`<div class="score"><p class="eyebrow" style="color:#F4B183">${esc(name)}</p><p class="big">${score} / ${Q.qs.length}</p><p>${score===Q.qs.length?'Perfect score!':score>=3?'Well done!':'Good try. Read the answers above and try the lesson again.'}</p><p class="small" style="opacity:.8">${esc(note)}</p><a class="btn" href="#home" style="margin-top:8px">Back to lessons</a></div>`;
    $('qresult').scrollIntoView({behavior:'smooth',block:'start'});
  });
}

const INTRO={
 l1:{hook:'Have you used ChatGPT, Google Lens or an Instagram filter this week? Is Google Maps AI?',goals:['Tell AI, Machine Learning, Deep Learning and Generative AI apart','Explain how a machine learns, and how ChatGPT writes its answers','Write a strong prompt and know the limits of AI']},

 l3:{hook:'A chemist shop has 3,000 medicines. How does it know which ones expire next month?',goals:['Explain why businesses use a database instead of Excel','Name the parts of a table: row, column, primary key, foreign key','Write SELECT queries with WHERE, ORDER BY, COUNT and SUM']},
 l4:{hook:'Most AI tools are built with Python. Today you write your first useful program.',goals:['Use variables and the types int, float, str and bool','Take input and turn it into a number','Make decisions with if, elif and else']}
};
const STAGES=['intro','pre','lesson','post','closed'];
const STAGE_NAME={intro:'Introduction',pre:'Quick quiz',lesson:'Lesson',post:'Final quiz',closed:'Class ended'};
const LVIEW={l1:[vL1,initL1],l2:[vL2,initL2],l3:[vL3,initL3],l4:[vL4,initL4]};
let CLS=null, ME=null, clsTimer=null, clsKey='';
const meKey=id=>'class-'+id;
function loadMe(id){try{return JSON.parse(localStorage.getItem(meKey(id))||'null')}catch(e){return null}}
function saveMe(){try{localStorage.setItem(meKey(CLS.id),JSON.stringify(ME))}catch(e){}}
const newKey=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'k'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const lessonName=id=>(LESSONS.find(l=>l.id===id)||{}).name||id;
async function fetchActive(){
  if(!sb)return null;
  const {data,error}=await sb.from('class_sessions').select('*').eq('active',true).limit(1);
  if(error)return null; return (data&&data[0])||null;
}
async function enterClass(practiceLesson){
  clearInterval(clsTimer); clsKey='';
  if(practiceLesson){
    CLS={id:'practice-'+practiceLesson,lesson:practiceLesson,label:'Practice on your own',stage:'intro',practice:true};
    const s=loadMe(CLS.id); if(s&&s.pstage)CLS.stage=s.pstage;
  }else{
    main.innerHTML='<p class="muted">Finding your class…</p>';
    CLS=await fetchActive();
  }
  if(!CLS){main.innerHTML=`<section class="hero"><p class="eyebrow">Class</p><h1>No class is running right now</h1><p class="lead">When your teacher starts the class, this page opens it for you. You can also practise any lesson on your own.</p></section><div class="row"><button class="btn primary" id="retry">Check again</button><a class="btn" href="#home">Practise on your own</a></div>`;$('retry').addEventListener('click',()=>enterClass());return}
  ME=loadMe(CLS.id); renderClass();
  if(!CLS.practice)clsTimer=setInterval(pollClass,5000);
}
async function pollClass(){
  if(!location.hash.startsWith('#class')){clearInterval(clsTimer);return}
  const a=await fetchActive();
  if(!a||a.id!==CLS.id)CLS=Object.assign({},CLS,{stage:'closed'}); else CLS=a;
  renderClass();
}
function classStep(){
  const st=CLS.stage;
  if(!ME||!ME.name)return st==='closed'?'closed':'join';
  if(ME.postScore!=null)return 'done';
  if(st==='closed')return 'closed';
  if(st==='intro')return 'intro';
  if(ME.preScore==null)return 'pre';
  if(st==='pre')return 'wait-pre';
  if(st==='lesson')return 'lesson';
  return 'post';
}
function stepper(cur){
  const order=['intro','pre','lesson','post'], idx=order.indexOf(cur==='wait-pre'?'pre':cur==='done'?'post':cur);
  return `<ol class="steps">${order.map((s,i)=>`<li class="${i<idx||cur==='done'?'done':i===idx?'cur':''}">${STAGE_NAME[s]}</li>`).join('')}</ol>`;
}
function practiceNext(label){return CLS.practice?`<button class="btn primary" id="pnext">${label}</button>`:''}
function waitNote(t){return CLS.practice?'':`<p class="feedback info"><span class="dot"></span> ${t}</p>`}
function renderClass(force){
  const step=classStep(), key=step+'|'+CLS.stage;
  if(!force&&key===clsKey)return; clsKey=key;
  const L=CLS.lesson, I=INTRO[L], Q=QUIZ[L];
  const head=`<section class="hero"><p class="eyebrow">${esc(CLS.label||'Today’s class')} · ${esc(lessonName(L))}</p>${step==='join'||step==='closed'?'':stepper(step)}</section>`;
  let body='';
  if(step==='join'){
    let saved={};try{saved=JSON.parse(localStorage.getItem('student')||'{}')}catch(e){}
    body=`<h1>${esc(lessonName(L))}</h1><p class="lead">Type your details to join today’s class.</p>
    <form class="station" id="joinform"><div class="two">
      <label class="fld">Your full name<input id="jn" required maxlength="80" autocomplete="name" value="${esc(saved.name||'')}"></label>
      <label class="fld">Roll number (optional)<input id="jr" maxlength="30" value="${esc(saved.roll||'')}"></label>
      <label class="fld">Course<select id="jc">${COURSES.map(c=>`<option ${saved.course===c?'selected':''}>${c}</option>`).join('')}</select></label>
      <label class="fld">Year<select id="jy">${[1,2,3,4,5].map(y=>`<option ${String(saved.year)===String(y)?'selected':''}>${y}</option>`).join('')}</select></label>
    </div><button class="btn primary" type="submit">Join the class</button></form>`;
  }else if(step==='intro'||step==='wait-pre'){
    body=`<h1>${esc(lessonName(L))}</h1>
    <section class="station" style="background:var(--ink);color:var(--bg);border:0"><p class="num" style="color:#F4B183">Think about this</p><h2 style="color:inherit">${esc(I.hook)}</h2></section>
    <section class="station"><p class="num">Today you will learn to</p>${I.goals.map((g,i)=>`<div class="row" style="flex-wrap:nowrap;align-items:flex-start"><span class="tag">${i+1}</span><p>${esc(g)}</p></div>`).join('')}</section>
    ${step==='wait-pre'?`<p class="feedback good">Quick quiz saved. We will compare it with your final quiz at the end.</p>${waitNote('Waiting for your teacher to start the lesson…')}`:waitNote('Waiting for your teacher to start the quick quiz…')}
    ${step==='intro'?practiceNext('Start the quick quiz'):practiceNext('Start the lesson')}`;
  }else if(step==='pre'||step==='post'){
    const pre=step==='pre';
    body=`<h1>${pre?'Quick quiz: what do you know already?':'Final quiz'}</h1>
    <p class="lead">${pre?'Don’t worry if you don’t know. This only shows where you are starting from. Answers come at the end of the class.':'Same 5 questions as the quick quiz. Let’s see how much you learned.'}</p>
    <form class="station" id="cquiz" data-phase="${step}">${Q.qs.map((q,i)=>`<fieldset class="q" style="margin:0"><legend style="font-weight:700;padding:0 4px">${i+1}. ${esc(q.q)}</legend>${q.o.map((o,j)=>`<label class="opt"><input type="radio" name="c${i}" value="${j}" required> <span>${esc(o)}</span></label>`).join('')}</fieldset>`).join('')}
    <button class="btn primary" type="submit" id="csub">${pre?'Submit quick quiz':'Submit final quiz'}</button></form>`;
  }else if(step==='lesson'){
    body=`${LVIEW[L][0](true)}${waitNote('Your teacher will open the final quiz at the end of the lesson.')}${practiceNext('Take the final quiz')}`;
  }else if(step==='done'){
    const pre=ME.preScore??0, post=ME.postScore, n=Q.qs.length, gain=post-pre;
    body=`<div class="score"><p class="eyebrow" style="color:#F4B183">${esc(ME.name)}</p><p class="small" style="opacity:.85">Quick quiz → Final quiz</p><p class="big">${pre} → ${post} <span style="font-size:.5em">/ ${n}</span></p>
      <p>${gain>0?`You improved by ${gain} mark${gain>1?'s':''}. Well done!`:post===n?'Full marks from start to finish!':gain===0?'Same score as the start. Read the answers below.':'Read the answers below and try the lesson again.'}</p><p class="small" style="opacity:.8">${esc(ME.note||'')}</p></div>
    <section class="station"><h2>Answers</h2>${Q.qs.map((q,i)=>{const a=ME.postAns[i],ok=a===q.a;return `<div class="q"><b>${i+1}. ${esc(q.q)}</b><p class="feedback ${ok?'good':'bad'}">${ok?'Correct: ':'You chose: '+esc(q.o[a])+'. Correct: '}${esc(q.o[q.a])}</p><p class="small muted">${esc(q.why)}</p></div>`}).join('')}</section>
    <a class="btn" href="#home">Explore all lessons</a>`;
  }else{
    body=`<h1>This class has ended</h1><p class="lead">Thank you for joining. You can still practise any lesson on your own.</p><a class="btn primary" href="#home">Explore all lessons</a>`;
  }
  main.innerHTML=head+body;
  if(step==='lesson')LVIEW[L][1]();
  bindClass(step);
  window.scrollTo(0,0);
}
function bindClass(step){
  const jf=$('joinform');
  if(jf)jf.addEventListener('submit',e=>{e.preventDefault();const name=$('jn').value.trim();if(!name){toast('Please type your name');return}
    ME={key:newKey(),name,roll:$('jr').value.trim(),course:$('jc').value,year:+$('jy').value,preScore:null,postScore:null};
    try{localStorage.setItem('student',JSON.stringify({name,roll:ME.roll,course:ME.course,year:ME.year}))}catch(err){}
    saveMe(); renderClass(true)});
  const pn=$('pnext');
  if(pn)pn.addEventListener('click',()=>{const nx={intro:'pre',pre:'lesson',lesson:'post'}[CLS.stage]||'post';CLS.stage=step==='intro'?'pre':step==='wait-pre'?'lesson':nx;ME.pstage=CLS.stage;saveMe();renderClass(true)});
  const f=$('cquiz');
  if(f)f.addEventListener('submit',async e=>{
    e.preventDefault(); const phase=f.dataset.phase, Q=QUIZ[CLS.lesson];
    const ans=Q.qs.map((_,i)=>{const r=document.querySelector(`input[name="c${i}"]:checked`);return r?+r.value:-1});
    if(ans.includes(-1)){toast('Answer every question first');return}
    const score=ans.reduce((s,a,i)=>s+(a===Q.qs[i].a?1:0),0);
    $('csub').disabled=true;
    let note='';
    if(sb){
      const rec={session_id:CLS.practice?null:CLS.id,student_key:ME.key,phase:CLS.practice?'practice':phase,student_name:ME.name,roll_no:ME.roll,course:ME.course,year:ME.year,lesson:CLS.lesson,score,total:Q.qs.length,answers:ans};
      const {error}=await sb.from('quiz_results').insert(rec);
      if(error&&error.code!=='23505'){note='Could not send to your teacher. Show this screen to your teacher.';if(phase==='pre')toast(note)}
      else note=CLS.practice?'Practice result saved.':'Your results were sent to your teacher.';
    }else note='Practice mode: results are not saved.';
    if(phase==='pre'){ME.preScore=score;ME.preAns=ans}else{ME.postScore=score;ME.postAns=ans;ME.note=note}
    if(CLS.practice)ME.pstage=phase==='pre'?'pre':'post';
    saveMe(); renderClass(true);
  });
}

  $('slogin').addEventListener('submit',async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:$('se').value.trim(),password:$('sp').value});if(error){$('serr').textContent='Sign-in failed: '+error.message;return}onReady()});
}
const siteLink=()=>location.href.split('#')[0];
let TCH=null, tchTimer=null, confirmEnd=false;
function vTeacher(){return `<section class="hero"><p class="eyebrow">Teacher</p><h1>Class control</h1><p class="lead">Choose today’s lesson, then move the class from step to step. Students’ screens follow you.</p></section><div id="tbody"><p class="muted">Loading…</p></div>`}
function initTeacher(){requireStaff($('tbody'),loadTeacher)}
async function loadTeacher(){
  clearInterval(tchTimer);
  const {data,error}=await sb.from('class_sessions').select('*').eq('active',true).limit(1);
  if(error){$('tbody').innerHTML=`<p class="feedback bad">${esc(error.message)}</p>`;return}
  TCH=(data&&data[0])||null; confirmEnd=false; renderTeacher();
  if(TCH)tchTimer=setInterval(()=>{if(location.hash==='#teacher')liveCounts();else clearInterval(tchTimer)},5000);
}
function renderTeacher(){
  const el=$('tbody'); if(!el)return;
  if(!TCH){
    el.innerHTML=`<form class="station" id="tstart"><h2>Start a class</h2><div class="two">
      <label class="fld">Lesson<select id="tl">${LESSONS.map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select></label>
      <label class="fld">Class name<input id="tlab" maxlength="80" placeholder="BCA 2nd year · 18 Nov"></label></div>
      <button class="btn primary" type="submit">Start class</button></form>
      <div class="row"><a class="btn" href="#reports">Open reports</a><button class="btn" id="tsignout">Sign out</button></div>`;
    $('tstart').addEventListener('submit',async e=>{e.preventDefault();
      await sb.from('class_sessions').update({active:false,stage:'closed',ended_at:new Date().toISOString()}).eq('active',true);
      const {data,error}=await sb.from('class_sessions').insert({lesson:$('tl').value,label:$('tlab').value.trim(),stage:'intro',active:true}).select().single();
      if(error){toast('Could not start: '+error.message);return} toast('Class started'); loadTeacher()});
    $('tsignout').addEventListener('click',async()=>{await sb.auth.signOut();initTeacher()});
    return;
  }
  const order=['intro','pre','lesson','post'];
  el.innerHTML=`<section class="station"><div class="row" style="justify-content:space-between"><div><p class="num">Live now</p><h2>${esc(lessonName(TCH.lesson))}</h2><p class="muted small">${esc(TCH.label||'')} · started ${esc(new Date(TCH.created_at).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}))}</p></div><span class="tag good">Step: ${STAGE_NAME[TCH.stage]}</span></div>
    <p class="small muted">Tap the step the class should see now:</p>
    <div class="row">${order.map((s,i)=>`<button class="btn ${TCH.stage===s?'on':''}" data-stage="${s}">${i+1}. ${STAGE_NAME[s]}</button>`).join('')}</div>
    <div class="row">${confirmEnd?`<span class="small">End this class? Students can no longer submit.</span><button class="btn primary" id="tendy">Yes, end class</button><button class="btn" id="tendn">Keep it running</button>`:`<button class="btn" id="tend">End class</button>`}<a class="btn" href="#reports">Reports</a></div></section>
  <div class="two"><section class="station"><p class="num">Students open</p><p style="font-family:var(--mono);word-break:break-all;font-size:15px;user-select:all">${esc(siteLink())}</p><div id="qr" style="align-self:flex-start;background:#fff;padding:10px;border-radius:12px"></div></section>
  <section class="station" id="live"><p class="muted">Loading live results…</p></section></div>`;
  document.querySelectorAll('[data-stage]').forEach(b=>b.addEventListener('click',async()=>{
    const {data,error}=await sb.from('class_sessions').update({stage:b.dataset.stage}).eq('id',TCH.id).select().single();
    if(error){toast(error.message);return} TCH=data; renderTeacher(); toast('Students now see: '+STAGE_NAME[TCH.stage])}));
  if($('tend'))$('tend').addEventListener('click',()=>{confirmEnd=true;renderTeacher()});
  if($('tendn'))$('tendn').addEventListener('click',()=>{confirmEnd=false;renderTeacher()});
  if($('tendy'))$('tendy').addEventListener('click',async()=>{await sb.from('class_sessions').update({active:false,stage:'closed',ended_at:new Date().toISOString()}).eq('id',TCH.id);clearInterval(tchTimer);toast('Class ended');location.hash='#reports'});
  try{if(window.QRCode)new QRCode($('qr'),{text:siteLink(),width:200,height:200})}catch(e){}
  liveCounts();
}
async function liveCounts(){
  if(!TCH||!$('live'))return;
  const {data}=await sb.from('quiz_results').select('*').eq('session_id',TCH.id);
  const rows=data||[], by={};
  rows.forEach(r=>{(by[r.student_key]=by[r.student_key]||{name:r.student_name})[r.phase]=r.score});
  const st=Object.values(by), n=QUIZ[TCH.lesson].qs.length;
  const pre=st.filter(s=>s.pre!=null), post=st.filter(s=>s.post!=null);
  const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length/n*100)+'%':'–';
  $('live').innerHTML=`<p class="num">Live results</p><div class="kpis"><div class="kpi"><b>${pre.length}</b><span class="small muted">Quick quiz done · avg ${avg(pre.map(s=>s.pre))}</span></div><div class="kpi"><b>${post.length}</b><span class="small muted">Final quiz done · avg ${avg(post.map(s=>s.post))}</span></div></div>
  <div class="tablebox"><table><tr><th>Student</th><th>Quick</th><th>Final</th></tr>${st.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.pre??'–'}</td><td>${s.post??'–'}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">Waiting for students…</td></tr>'}</table></div><p class="small muted">Updates every 5 seconds.</p>`;
}

let REP={sessions:[],results:[],sel:null};
function vReports(){return `<section class="hero"><p class="eyebrow">Reports</p><h1>Learning reports</h1><p class="lead">Quick quiz at the start versus final quiz at the end, for every class.</p></section><div id="rbody"><p class="muted">Loading…</p></div>`}
function initReports(){requireStaff($('rbody'),loadReports)}
async function loadReports(){
  const [s,r]=await Promise.all([sb.from('class_sessions').select('*').order('created_at',{ascending:false}).limit(300),sb.from('quiz_results').select('*').order('created_at',{ascending:true}).limit(10000)]);
  if(s.error||r.error){$('rbody').innerHTML=`<p class="feedback bad">${esc((s.error||r.error).message)}</p>`;return}
  REP.sessions=s.data||[]; REP.results=(r.data||[]).filter(x=>x.session_id);
  if(REP.sel&&!REP.sessions.find(x=>x.id===REP.sel))REP.sel=null;
  renderReports();
}
function sessionStats(sid){
  const ses=REP.sessions.find(x=>x.id===sid), n=QUIZ[ses.lesson].qs.length, by={};
  REP.results.filter(r=>r.session_id===sid).forEach(r=>{const s=by[r.student_key]=by[r.student_key]||{name:r.student_name,roll:r.roll_no,course:r.course,year:r.year};s[r.phase]=r.score;s[r.phase+'Ans']=r.answers});
  const st=Object.values(by), both=st.filter(s=>s.pre!=null&&s.post!=null);
  const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const preAvg=mean(st.filter(s=>s.pre!=null).map(s=>s.pre/n*100)), postAvg=mean(st.filter(s=>s.post!=null).map(s=>s.post/n*100));
  const gain=mean(both.map(s=>(s.post-s.pre)/n*100)), improved=both.filter(s=>s.post>s.pre).length;
  const perQ=QUIZ[ses.lesson].qs.map((q,i)=>{const p=st.filter(s=>Array.isArray(s.preAns)),o=st.filter(s=>Array.isArray(s.postAns));return {pre:p.length?Math.round(p.filter(s=>s.preAns[i]===q.a).length/p.length*100):null,post:o.length?Math.round(o.filter(s=>s.postAns[i]===q.a).length/o.length*100):null}});
  return {ses,n,st,both,preAvg,postAvg,gain,improved,perQ};
}
const pc=v=>v==null?'–':Math.round(v)+'%';
function renderReports(){
  const el=$('rbody'); if(!el)return;
  const sesList=REP.sessions.filter(s=>REP.results.some(r=>r.session_id===s.id)||s.active);
  let html=`<div class="row"><button class="btn" id="rref">Refresh</button><a class="btn" href="#teacher">Class control</a><button class="btn" id="rout">Sign out</button></div>
  <section class="station"><h2>All classes</h2><div class="tablebox"><table><tr><th>Date</th><th>Class</th><th>Lesson</th><th>Students</th><th>Quick quiz</th><th>Final quiz</th><th>Gain</th><th></th></tr>
  ${sesList.map(s=>{const k=sessionStats(s.id);return `<tr><td>${esc(new Date(s.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short'}))}</td><td>${esc(s.label||'–')}${s.active?' <span class="tag good">live</span>':''}</td><td>${esc((LESSONS.find(l=>l.id===s.lesson)||{}).short)}</td><td>${k.st.length}</td><td>${pc(k.preAvg)}</td><td>${pc(k.postAvg)}</td><td><b style="color:${(k.gain??0)>0?'var(--good)':'inherit'}">${k.gain==null?'–':(k.gain>0?'+':'')+Math.round(k.gain)+' pts'}</b></td><td><button class="btn" data-rsel="${s.id}" style="min-height:36px;padding:6px 12px">View</button></td></tr>`}).join('')||'<tr><td colspan="8" class="muted">No classes yet. Start one from Class control.</td></tr>'}
  </table></div></section>`;
  if(REP.sel){
    const k=sessionStats(REP.sel), Q=QUIZ[k.ses.lesson].qs;
    html+=`<section class="station" id="rdetail"><p class="num">${esc(new Date(k.ses.created_at).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}))}</p><h2>${esc(k.ses.label||'Class')} · ${esc(lessonName(k.ses.lesson))}</h2>
    <div class="kpis"><div class="kpi"><b>${k.st.length}</b><span class="small muted">Students joined</span></div><div class="kpi"><b>${pc(k.preAvg)}</b><span class="small muted">Average, quick quiz</span></div><div class="kpi"><b>${pc(k.postAvg)}</b><span class="small muted">Average, final quiz</span></div><div class="kpi"><b style="color:var(--good)">${k.gain==null?'–':(k.gain>0?'+':'')+Math.round(k.gain)+' pts'}</b><span class="small muted">Average gain</span></div><div class="kpi"><b>${k.both.length?Math.round(k.improved/k.both.length*100)+'%':'–'}</b><span class="small muted">Students who improved</span></div></div>
    <h3>Correct answers per question</h3><div class="legend"><span><i style="background:var(--soft)"></i>Quick quiz</span><span><i style="background:var(--accent)"></i>Final quiz</span></div>
    <div class="bars">${Q.map((q,i)=>`<div class="qbar"><p class="small"><b>Q${i+1}.</b> ${esc(q.q)}</p><div class="bar"><span class="small muted">Before</span><div class="track"><div class="fillbar" style="width:${k.perQ[i].pre??0}%;background:var(--soft)"></div></div><span>${pc(k.perQ[i].pre)}</span></div><div class="bar"><span class="small muted">After</span><div class="track"><div class="fillbar win" style="width:${k.perQ[i].post??0}%"></div></div><span>${pc(k.perQ[i].post)}</span></div></div>`).join('')}</div>
    <h3>Students</h3><div class="tablebox"><table><tr><th>Name</th><th>Roll</th><th>Course</th><th>Quick quiz</th><th>Final quiz</th><th>Change</th></tr>
    ${k.st.sort((a,b)=>a.name.localeCompare(b.name)).map(s=>{const d=s.pre!=null&&s.post!=null?s.post-s.pre:null;return `<tr><td>${esc(s.name)}</td><td>${esc(s.roll)}</td><td>${esc(s.course)} ${s.year?'· Y'+s.year:''}</td><td>${s.pre??'–'} / ${k.n}</td><td>${s.post??'–'} / ${k.n}</td><td>${d==null?'–':`<span class="tag ${d>0?'good':d<0?'bad':''}">${d>0?'+':''}${d}</span>`}</td></tr>`}).join('')}
    </table></div><div class="row"><button class="btn primary" id="rcsv">Download CSV</button></div></section>`;
  }
  el.innerHTML=html;
  $('rref').addEventListener('click',loadReports);
  $('rout').addEventListener('click',async()=>{await sb.auth.signOut();initReports()});
  document.querySelectorAll('[data-rsel]').forEach(b=>b.addEventListener('click',()=>{REP.sel=b.dataset.rsel;renderReports();$('rdetail').scrollIntoView({behavior:'smooth'})}));
  if($('rcsv'))$('rcsv').addEventListener('click',()=>{
    const k=sessionStats(REP.sel);
    const rows=[['class','lesson','date','name','roll','course','year','quick_quiz','final_quiz','out_of','change'],...k.st.map(s=>[k.ses.label,lessonName(k.ses.lesson),k.ses.created_at,s.name,s.roll,s.course,s.year,s.pre??'',s.post??'',k.n,s.pre!=null&&s.post!=null?s.post-s.pre:''])];
    const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='class-report.csv';a.click();
  });
}

/* ================= ROUTER ================= */
const VIEWS={home:[vHome],l1:[()=>vL1(false),initL1],l2:[()=>vL2(false),initL2],l3:[()=>vL3(false),initL3],l4:[()=>vL4(false),initL4],teacher:[vTeacher,initTeacher],reports:[vReports,initReports]};
async function route(){
  const h=(location.hash||'').slice(1);
  clearInterval(clsTimer); clearInterval(tchTimer);
  const navCur=k=>document.querySelectorAll('.navl a').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')==='#'+k?'page':'false'));
  if(h==='class'||h.startsWith('class-')){
    const pl=h.startsWith('class-')&&QUIZ[h.slice(6)]?h.slice(6):null;
    document.body.classList.add('inclass'); navCur(''); document.title='Today’s class · Learn Computing Today';
    enterClass(pl); return;
  }
  document.body.classList.remove('inclass');
  if(h===''&&sb){const a=await fetchActive(); if(a){location.replace('#class');return}}
  let key=h||'home', v=VIEWS[key], quizId=null;
  if(key==='results')v=VIEWS.reports;
  if(!v&&key.startsWith('quiz-')&&QUIZ[key.slice(5)]){quizId=key.slice(5);v=[()=>vQuiz(quizId),()=>initQuiz(quizId)]}
  if(!v){key='home';v=VIEWS.home}
  main.innerHTML=v[0](); if(v[1])v[1]();
  navCur(quizId||key);
  document.title=(key==='home'?'':((LESSONS.find(l=>l.id===(quizId||key))||{}).name||(key==='teacher'?'Class control':key==='reports'||key==='results'?'Reports':''))+' · ')+'Learn Computing Today';
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route); route();
})();

</script>
