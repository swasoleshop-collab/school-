<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E2B2F; --muted:#5D6B67; --page:#F2F4F3; --paper:#FFFFFF; --line:#D8DEDB;
  --board:#23423B; --board-2:#2D554C; --board-ink:#E4EEE9;
  --pencil:#E8B42F; --green:#2F8F5B; --amber:#D69A1C; --red:#C4473C; --none:#CBD2CF;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--page);font-size:15px;line-height:1.5}
a{color:var(--board)}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--board);color:var(--board-ink);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh}
.brand{font-weight:700;font-size:17px;line-height:1.25;padding:0 8px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand .lights{margin-bottom:10px}
.brand small{display:block;font-weight:400;opacity:.75;font-size:12.5px;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:14px;flex:1;overflow:auto}
.nav a{color:var(--board-ink);text-decoration:none;padding:9px 10px;border-radius:6px;font-size:14.5px}
.nav a:hover{background:var(--board-2)}
.nav a.on{background:var(--board-ink);color:var(--board);font-weight:700}
.me{border-top:1px solid rgba(255,255,255,.12);padding:14px 8px 0;font-size:13px}
.me .who{font-weight:700}
.me .roles{opacity:.75}
.me button{background:none;border:0;color:var(--board-ink);text-decoration:underline;cursor:pointer;padding:4px 0;font:inherit;margin-right:10px}
.menu-btn{display:none}
main{padding:28px 32px 60px;min-width:0}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:18px;margin:0}
h3{font-size:18px;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 20px}
.ctx{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:0 0 18px;padding:12px;background:var(--paper);border:1px solid var(--line);border-radius:8px}
.ctx label{display:flex;flex-direction:column;font-size:12.5px;color:var(--muted);gap:3px}
.ctx select{min-width:160px}
select,input,textarea{font:inherit;color:var(--ink);border:1px solid #BFC8C4;border-radius:6px;padding:7px 9px;background:#fff;min-width:0}
:focus-visible{outline:3px solid var(--pencil);outline-offset:1px}
.btn{font:inherit;font-size:14px;border-radius:6px;padding:7px 13px;border:1px solid transparent;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--board);color:#fff}
.btn.primary:hover{background:var(--board-2)}
.btn.ghost{background:var(--paper);border-color:#BFC8C4;color:var(--ink)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger{background:var(--red);color:#fff}
.btn.small{padding:3px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.danger-text{color:var(--red)!important}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:18px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.export{display:inline-flex;gap:4px;align-items:center}
.export span{font-size:13px;color:var(--muted);margin-right:2px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:700;background:#E9EEEC;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid #ECEFEE;vertical-align:middle}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--paper);border:1px dashed #BFC8C4;border-radius:8px}
.help{color:var(--muted);font-size:13.5px;margin:-4px 0 12px;max-width:80ch}
.note{background:#FFF7DE;border:1px solid #F0D98A;border-radius:8px;padding:10px 12px;font-size:13.5px;margin-bottom:14px;max-width:90ch}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:2px solid var(--line);margin-bottom:18px}
.tabs button{font:inherit;background:none;border:0;padding:9px 12px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--pencil);font-weight:700}
.lights{display:inline-flex;gap:4px;vertical-align:middle}
.dot{width:13px;height:13px;border-radius:50%;background:var(--none);display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.dot.green{background:var(--green)} .dot.yellow{background:var(--amber)} .dot.red{background:var(--red)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:700;background:#E6EBE9;color:#33413D;white-space:nowrap}
.pill.ready_up,.pill.ap_candidate,.pill.approve{background:#DDF1E5;color:#1D6B41}
.pill.at_risk{background:#F8DEDA;color:#9A2E25}
.pill.check_not_met,.pill.hold{background:#FBEBC8;color:#7A5300}
.pill.override{background:#E2E4F6;color:#33388A}
.chip{display:inline-flex;align-items:center;gap:4px;background:#E6EBE9;border-radius:999px;padding:2px 4px 2px 9px;font-size:12.5px;margin:2px 4px 2px 0}
.chip button{border:0;background:none;cursor:pointer;font-size:15px;line-height:1;color:var(--muted);padding:0 4px}
.overlay{position:fixed;inset:0;background:rgba(20,30,28,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:10px;max-width:780px;width:100%;position:relative;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.mbody{padding:22px 22px 8px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px 20px;flex-wrap:wrap}
.x{position:absolute;top:8px;right:12px;border:0;background:none;font-size:26px;cursor:pointer;color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:700}
.field small{color:var(--muted);font-size:12.5px}
.field.wide{grid-column:1/-1}
.check{display:flex;gap:8px;align-items:center;font-weight:400!important}
.picklist{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:10px 0}
.picklist label{display:flex;gap:8px;align-items:center;padding:4px 0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.error{background:var(--red)}
.grid-input{width:76px;text-align:right;padding:4px 6px}
.grid-input.changed{background:#FFF4CF;border-color:var(--pencil)}
.grid-input.bad{border-color:var(--red);background:#FCE3E0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.bars{display:grid;grid-template-columns:120px 1fr;gap:10px 14px;align-items:center}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#E6EBE9}
.bar i{display:block;height:100%}
.legend{font-size:12.5px;color:var(--muted);margin-top:10px;display:flex;gap:14px;flex-wrap:wrap}
.legend .dot{width:10px;height:10px;margin-right:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--board)}
.login .card{background:#fff;border-radius:12px;padding:30px;max-width:390px;width:100%}
.login .card .lights{margin-bottom:12px}
.login .field{margin-bottom:12px}
.login .btn{width:100%;margin-top:6px}
.linkbtn{background:none;border:0;color:var(--board);text-decoration:underline;cursor:pointer;font:inherit;padding:8px 0 0}
.rules-grid{display:grid;grid-template-columns:minmax(220px,1fr) 130px minmax(140px,180px);gap:8px 14px;align-items:center;margin-bottom:6px}
.rules-grid .inh{color:var(--muted);font-size:12.5px}
.levels-grid input{width:90px}
.good{color:var(--green);font-weight:700}
.bad{color:var(--red);font-weight:700}
pre.json{background:#F4F6F5;border:1px solid var(--line);border-radius:6px;padding:10px;font-size:12px;overflow:auto;max-height:300px}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:relative;height:auto;padding:14px}
  .nav,.me{display:none}
  .shell.open .nav,.shell.open .me{display:flex}
  .shell.open .me{display:block}
  .menu-btn{display:inline-block;position:absolute;right:14px;top:14px}
  main{padding:18px 14px 50px}
  .form,.two{grid-template-columns:1fr}
  .rules-grid{grid-template-columns:1fr 110px}
  .rules-grid .inh{grid-column:1/-1;margin-top:-6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
// =====================================================================
//  1. YOUR SUPABASE KEYS  -  change these two lines
//     Supabase -> Project Settings -> API (or "API Keys")
//     Use the "Project URL" and the "anon public" key. NEVER the service_role key.
// =====================================================================
const SUPABASE_URL = 'https://wtmdaogxzomzzyxvoztg.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_7PlsOubjfQV4yei2htCMmQ_-v71EsN8';
// =====================================================================

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const S = {
  user: null, profile: null, roles: [], school: null,
  years: [], terms: [], subjects: [], levels: [], types: [], skills: [], staff: [], labels: {},
  sel: { yearId: null, termId: null, subjectId: null, classId: null }
};
const PAGES = {};

// ------------------------------- helpers -------------------------------
const $ = (sel, root = document) => root.querySelector(sel);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const byId = (list, id) => list.find(x => x.id === id);
const nameOf = (list, id) => byId(list, id)?.name ?? '';
const staffName = id => byId(S.staff, id)?.full_name ?? '';
const today = () => new Date().toISOString().slice(0, 10);
const fmt = v => {
  if (v === null || v === undefined || v === '') return '—';
  if (typeof v === 'number') return String(Math.round(v * 10) / 10);
  return String(v);
};
const studentName = st => st ? `${st.first_name} ${st.last_name}` : '';

function toast(msg, kind = 'ok') {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show ' + kind;
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.className = ''; }, kind === 'error' ? 6000 : 3000);
}

// Runs a Supabase request; shows the error and stops if it fails
async function run(req) {
  const { data, error } = await req;
  if (error) { toast(friendlyError(error.message), 'error'); throw error; }
  return data;
}
function friendlyError(m) {
  if (/row-level security/i.test(m)) return 'You do not have permission to change this.';
  if (/duplicate key/i.test(m)) return 'This already exists (duplicate).';
  if (/foreign key/i.test(m)) return 'This is still used by other records. Set it to inactive instead of deleting it.';
  return m;
}

const hasRole = r => S.roles.some(x => x.role === r);
const isAdmin = () => hasRole('admin');
const isLeader = () => hasRole('admin') || hasRole('principal');
const isCoord = () => hasRole('coordinator');
const isTeacher = () => hasRole('teacher');
const canCoord = subjectId => S.roles.some(r => r.role === 'coordinator' && (r.subject_id === null || r.subject_id === subjectId));
const canManageSubject = subjectId => isAdmin() || canCoord(subjectId);

const termsOfYear = yid => S.terms.filter(t => t.academic_year_id === yid);
const quartersOf = yid => termsOfYear(yid).filter(t => t.term_type === 'quarter').sort((a, b) => a.starts_on.localeCompare(b.starts_on));
const label = (group, code) => (S.labels[group] && S.labels[group][code]) || code || '';

function main() { return $('#main'); }

// ------------------------------- loading -------------------------------
async function loadBase() {
  S.profile = await run(sb.from('profiles').select('*').eq('id', S.user.id).maybeSingle());
  if (!S.profile) throw new Error('no-profile');
  S.roles = await run(sb.from('user_roles').select('*').eq('user_id', S.user.id));
  S.school = await run(sb.from('schools').select('*').eq('id', S.profile.school_id).single());
  await loadLookups();
}

async function loadLookups() {
  const [years, terms, subjects, levels, types, skills, staff, labels] = await Promise.all([
    run(sb.from('academic_years').select('*').order('starts_on', { ascending: false })),
    run(sb.from('terms').select('*').order('starts_on')),
    run(sb.from('subjects').select('*').order('name')),
    run(sb.from('levels').select('*').order('rank')),
    run(sb.from('assessment_types').select('*').order('name')),
    run(sb.from('skills').select('*').order('name')),
    run(sb.from('profiles').select('id,full_name,email,is_active').order('full_name')),
    run(sb.from('settings').select('key,value').is('subject_id', null).is('level_id', null).like('key', 'labels.%'))
  ]);
  Object.assign(S, { years, terms, subjects, levels, types, skills, staff });
  S.labels = {};
  labels.forEach(r => { S.labels[r.key.slice(7)] = r.value; });

  if (!S.sel.yearId || !byId(years, S.sel.yearId)) S.sel.yearId = (years.find(y => y.is_current) || years[0])?.id || null;
  const yTerms = termsOfYear(S.sel.yearId);
  if (!S.sel.termId || !yTerms.some(t => t.id === S.sel.termId)) {
    const q = quartersOf(S.sel.yearId);
    const d = today();
    S.sel.termId = (q.find(t => t.starts_on <= d && t.ends_on >= d) || q[0] || yTerms[0])?.id || null;
  }
  if (!S.sel.subjectId || !byId(subjects, S.sel.subjectId)) {
    const mine = subjects.find(s => S.roles.some(r => r.role === 'coordinator' && r.subject_id === s.id));
    S.sel.subjectId = (mine || subjects[0])?.id || null;
  }
}

// ------------------------------- start / auth -------------------------------
async function start() {
  if (SUPABASE_URL.includes('YOUR-PROJECT') || SUPABASE_ANON_KEY.includes('YOUR-ANON')) { renderSetupNeeded(); return; }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { renderLogin(); return; }
  S.user = session.user;
  try {
    await loadBase();
  } catch (e) {
    if (e.message === 'no-profile') { renderNoProfile(); return; }
    renderLogin('Could not load your account: ' + (e.message || e));
    return;
  }
  renderShell();
  route();
}

sb.auth.onAuthStateChange(evt => {
  if (evt === 'PASSWORD_RECOVERY') renderNewPassword();
  if (evt === 'SIGNED_OUT') { location.hash = ''; location.reload(); }
});
window.addEventListener('hashchange', () => { if (S.profile) route(); });

const LOGO = '<span class="lights" aria-hidden="true"><i class="dot green"></i><i class="dot yellow"></i><i class="dot red"></i><i class="dot"></i></span>';

function renderSetupNeeded() {
  $('#app').innerHTML = `<div class="login"><div class="card">${LOGO}<h3>Connect to Supabase</h3>
  <p>Open <b>index.html</b> in a text editor and fill in the two lines near the top:</p>
  <p><code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code></p>
  <p class="help">Find them in Supabase → Project Settings → API. Use the <b>anon public</b> key only.</p></div></div>`;
}

function renderLogin(msg) {
  $('#app').innerHTML = `<div class="login"><form class="card" id="loginForm">${LOGO}
    <h3>Student Progress</h3>
    ${msg ? `<p class="bad">${esc(msg)}</p>` : ''}
    <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="username" required></div>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <button class="btn primary" type="submit">Sign in</button>
    <button class="linkbtn" type="button" id="forgot">Forgot password?</button>
  </form></div>`;
  $('#em').focus();
  $('#loginForm').onsubmit = async e => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
    btn.disabled = false;
    if (error) { toast(error.message, 'error'); return; }
    start();
  };
  $('#forgot').onclick = async () => {
    const email = $('#em').value.trim();
    if (!email) { toast('Type your email first', 'error'); $('#em').focus(); return; }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    if (error) toast(error.message, 'error'); else toast('Check your email for a reset link');
  };
}

function renderNewPassword() {
  $('#app').innerHTML = `<div class="login"><form class="card" id="npForm">${LOGO}<h3>Set a new password</h3>
    <div class="field"><label for="np1">New password</label><input id="np1" type="password" minlength="8" required></div>
    <div class="field"><label for="np2">Repeat new password</label><input id="np2" type="password" minlength="8" required></div>
    <button class="btn primary" type="submit">Save password</button></form></div>`;
  $('#npForm').onsubmit = async e => {
    e.preventDefault();
    if ($('#np1').value !== $('#np2').value) { toast('The two passwords are different', 'error'); return; }
    const { error } = await sb.auth.updateUser({ password: $('#np1').value });
    if (error) { toast(error.message, 'error'); return; }
    toast('Password saved');
    location.hash = '';
    start();
  };
}

function renderNoProfile() {
  $('#app').innerHTML = `<div class="login"><div class="card">${LOGO}<h3>Almost there</h3>
    <p>You are signed in as <b>${esc(S.user.email)}</b>, but this login is not linked to a staff profile yet.</p>
    <p class="help">Ask the admin to add you (Supabase SQL file 4).</p>
    <button class="btn ghost" id="so">Sign out</button></div></div>`;
  $('#so').onclick = () => sb.auth.signOut();
}

// ------------------------------- shell and menu -------------------------------
const MENU = [
  { id: 'dashboard', label: 'Dashboard', show: () => true },
  { id: 'placement', label: 'Placement', show: () => true },
  { id: 'scores', label: 'Assessments & scores', show: () => isAdmin() || isCoord() || isTeacher() },
  { id: 'classes', label: 'Classes', show: () => true },
  { id: 'students', label: 'Students', show: () => isLeader() || isCoord() },
  { id: 'staff', label: 'Staff & roles', show: () => isLeader() },
  { id: 'settings', label: 'Settings', show: () => isAdmin() || isCoord() },
  { id: 'activity', label: 'Activity log', show: () => isLeader() }
];

function renderShell() {
  const roles = S.roles.map(r => r.role === 'coordinator' ? `coordinator${r.subject_id ? ' (' + nameOf(S.subjects, r.subject_id) + ')' : ''}` : r.role).join(', ');
  $('#app').innerHTML = `<div class="shell" id="shell">
    <aside class="side">
      <div class="brand">${LOGO}<br>${esc(S.school.name)}<small>Student progress and placement</small></div>
      <button class="btn ghost small menu-btn" id="menuBtn" aria-expanded="false">Menu</button>
      <nav class="nav" id="nav">${MENU.filter(m => m.show()).map(m => `<a href="#/${m.id}" data-page="${m.id}">${esc(m.label)}</a>`).join('')}</nav>
      <div class="me"><div class="who">${esc(S.profile.full_name)}</div><div class="roles">${esc(roles || 'no role yet')}</div>
        <button id="chpw">Change password</button><button id="signout">Sign out</button></div>
    </aside>
    <main id="main"></main></div>`;
  $('#signout').onclick = () => sb.auth.signOut();
  $('#chpw').onclick = changePassword;
  $('#menuBtn').onclick = () => {
    const open = $('#shell').classList.toggle('open');
    $('#menuBtn').setAttribute('aria-expanded', open);
  };
  $('#nav').addEventListener('click', () => $('#shell').classList.remove('open'));
}

function route() {
  const [page, param] = location.hash.replace(/^#\/?/, '').split('/');
  const allowed = MENU.filter(m => m.show()).map(m => m.id);
  const p = allowed.includes(page) ? page : 'dashboard';
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.page === p));
  closeModal();
  PAGES[p](param).catch(e => console.error(e));
}

function changePassword() {
  formModal('Change password', [
    { name: 'p1', label: 'New password', type: 'password', required: true, help: 'At least 8 characters' },
    { name: 'p2', label: 'Repeat new password', type: 'password', required: true }
  ], async v => {
    if (v.p1.length < 8) { toast('Use at least 8 characters', 'error'); throw new Error('short'); }
    if (v.p1 !== v.p2) { toast('The two passwords are different', 'error'); throw new Error('diff'); }
    await run(sb.auth.updateUser({ password: v.p1 }));
    toast('Password changed');
  });
}

// ------------------------------- context bar (year / term / subject / class) -------------------------------
function ctxBar(parts, extra = {}) {
  const out = [];
  if (parts.includes('year')) {
    out.push(`<label>School year<select data-k="yearId">${S.years.map(y => `<option value="${y.id}" ${y.id === S.sel.yearId ? 'selected' : ''}>${esc(y.name)}</option>`).join('')}</select></label>`);
  }
  if (parts.includes('quarter') || parts.includes('term')) {
    const list = parts.includes('quarter') ? quartersOf(S.sel.yearId) : termsOfYear(S.sel.yearId);
    out.push(`<label>${parts.includes('quarter') ? 'Quarter' : 'Term'}<select data-k="termId">${list.length ? list.map(t => `<option value="${t.id}" ${t.id === S.sel.termId ? 'selected' : ''}>${esc(t.name)}</option>`).join('') : '<option value="">No quarters yet</option>'}</select></label>`);
  }
  if (parts.includes('subject')) {
    out.push(`<label>Subject<select data-k="subjectId">${S.subjects.length ? S.subjects.map(s => `<option value="${s.id}" ${s.id === S.sel.subjectId ? 'selected' : ''}>${esc(s.name)}</option>`).join('') : '<option value="">No subjects yet</option>'}</select></label>`);
  }
  if (parts.includes('class')) {
    const cls = extra.classes || [];
    out.push(`<label>Class<select data-k="classId">${cls.length ? cls.map(c => `<option value="${c.id}" ${c.id === S.sel.classId ? 'selected' : ''}>${esc(c.name)}</option>`).join('') : '<option value="">No classes</option>'}</select></label>`);
  }
  return `<div class="ctx">${out.join('')}${extra.right ? `<div style="margin-left:auto" class="tools">${extra.right}</div>` : ''}</div>`;
}

function bindCtx(root, rerender) {
  root.querySelectorAll('.ctx select[data-k]').forEach(s => {
    s.onchange = () => {
      S.sel[s.dataset.k] = s.value || null;
      if (s.dataset.k === 'yearId') {
        const q = quartersOf(S.sel.yearId);
        S.sel.termId = (q[0] || termsOfYear(S.sel.yearId)[0])?.id || null;
        S.sel.classId = null;
      }
      rerender();
    };
  });
}

function needSetup(what) {

// ------------------------------- tables -------------------------------
function tableHTML(cols, rows, opts = {}) {

function lightsHTML(l) {

// ------------------------------- export (CSV / Excel / PDF) -------------------------------
function exportButtons(id) {
  return `<div class="export" id="${id}"><span>Export</span><button class="btn ghost small" data-fmt="csv">CSV</button><button class="btn ghost small" data-fmt="xlsx">Excel</button><button class="btn ghost small" data-fmt="pdf">PDF</button></div>`;
}
function bindExport(root, id, section, getData) {
  root.querySelectorAll(`#${id} [data-fmt]`).forEach(b => { b.onclick = () => doExport(b.dataset.fmt, section, getData()); });
}
function csvCell(v) {
  const s = v === null || v === undefined ? '' : String(v);
  return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function doExport(format, section, { title, head, body }) {
  if (!body.length) { toast('Nothing to export', 'error'); return; }
  const base = `${section.toLowerCase().replace(/[^a-z0-9]+/g, '-')}-${today()}`;
  const clean = body.map(r => r.map(v => (v === null || v === undefined) ? '' : v));
  if (format === 'csv') {
    const csv = [head, ...clean].map(r => r.map(csvCell).join(',')).join('\r\n');
    download(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }), base + '.csv');
  } else if (format === 'xlsx') {
    const ws = XLSX.utils.aoa_to_sheet([head, ...clean]);
    ws['!cols'] = head.map(h => ({ wch: Math.max(10, String(h).length + 2) }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, section.slice(0, 31));
    XLSX.writeFile(wb, base + '.xlsx');
  } else {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: head.length > 6 ? 'landscape' : 'portrait' });
    doc.setFontSize(14); doc.text(S.school.name, 14, 15);
    doc.setFontSize(11); doc.text(title, 14, 22);
    doc.setFontSize(8); doc.text(`Generated ${new Date().toLocaleString()} by ${S.profile.full_name}`, 14, 28);
    doc.autoTable({ head: [head], body: clean.map(r => r.map(String)), startY: 33, styles: { fontSize: 8 }, headStyles: { fillColor: [35, 66, 59] } });
    doc.save(base + '.pdf');
  }
  logIO('export', section, `${base}.${format}`, format, body.length);
}
function logIO(direction, section, file_name, file_format, row_count) {
  sb.from('imports_exports').insert({ school_id: S.school.id, user_id: S.user.id, direction, section, file_name, file_format, row_count })
    .then(({ error }) => { if (error) console.warn('log failed', error.message); });
}

// ------------------------------- import helpers -------------------------------
function pickFile(accept = '.csv,.xlsx,.xls') {
  return new Promise(resolve => {
    const i = document.createElement('input');
    i.type = 'file'; i.accept = accept;
    i.onchange = () => resolve(i.files[0] || null);
    i.click();
  });
}
async function readRows(file) {
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  const ws = wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws, { defval: '', raw: false }).map(normKeys);
}
const normKey = k => String(k).trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
function normKeys(row) {
  const o = {};
  for (const k in row) o[normKey(k)] = typeof row[k] === 'string' ? row[k].trim() : row[k];
  return o;
}
function downloadTemplate(name, head, sampleRows = []) {
  const ws = XLSX.utils.aoa_to_sheet([head, ...sampleRows]);
  ws['!cols'] = head.map(h => ({ wch: Math.max(12, String(h).length + 2) }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Template');
  XLSX.writeFile(wb, `${name}-template.xlsx`);
}
// rows: [{ show: {...}, data: {...}, error: '' }]
function importPreview({ title, file, section, cols, rows, onConfirm }) {
  const ok = rows.filter(r => !r.error);
  openModal(`<h3>${esc(title)}</h3>
    <p><span class="good">${ok.length} ready</span>${rows.length - ok.length ? `, <span class="bad">${rows.length - ok.length} with problems</span> (these will be skipped)` : ''}. Nothing is saved until you press Import.</p>
    ${tableHTML([...cols.map(c => ({ label: c.label, val: r => r.show[c.key] })), { label: 'Check', html: r => r.error ? `<span class="bad">${esc(r.error)}</span>` : '<span class="good">OK</span>' }], rows)}`,
    [{ label: `Import ${ok.length} row${ok.length === 1 ? '' : 's'}`, primary: true, disabled: !ok.length, onClick: async () => {
      await onConfirm(ok.map(r => r.data));
      logIO('import', section, file.name, file.name.toLowerCase().endsWith('.csv') ? 'csv' : 'xlsx', ok.length);
      closeModal();
    } }]);
}

// ------------------------------- modal and forms -------------------------------
function openModal(html, buttons = []) {
  const root = $('#modal-root');
  root.innerHTML = `<div class="overlay"><div class="modal" role="dialog" aria-modal="true"><button class="x" aria-label="Close">×</button><div class="mbody">${html}</div><div class="mfoot"></div></div></div>`;
  const foot = root.querySelector('.mfoot');
  [{ label: buttons.length ? 'Cancel' : 'Close', onClick: closeModal }, ...buttons].forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn ' + (b.primary ? 'primary' : b.danger ? 'danger' : 'ghost');
    el.textContent = b.label;
    el.type = 'button';
    if (b.disabled) el.disabled = true;
    el.onclick = async () => {
      el.disabled = true;
      try { await b.onClick(root); } catch (e) { console.warn(e); } finally { el.disabled = false; }
    };
    foot.appendChild(el);
  });
  root.querySelector('.x').onclick = closeModal;
  root.querySelector('.overlay').addEventListener('mousedown', e => { if (e.target.classList.contains('overlay')) closeModal(); });
  const first = root.querySelector('.mbody input, .mbody select, .mbody textarea');
  if (first) first.focus();
  return root;
}
function closeModal() { $('#modal-root').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function fieldHTML(f) {
  const v = f.value ?? '';
  const id = 'f_' + f.name;
  let input;
  if (f.type === 'select') {
    input = `<select id="${id}" name="${f.name}">${f.blank !== undefined ? `<option value="">${esc(f.blank)}</option>` : ''}${f.options.map(o => `<option value="${esc(o.value)}" ${String(o.value) === String(v) ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
  } else if (f.type === 'checkbox') {
    input = `<label class="check"><input type="checkbox" id="${id}" name="${f.name}" ${v ? 'checked' : ''}> ${esc(f.checkLabel || 'Yes')}</label>`;
  } else if (f.type === 'textarea') {
    input = `<textarea id="${id}" name="${f.name}" rows="3">${esc(v)}</textarea>`;
  } else {
    input = `<input id="${id}" name="${f.name}" type="${f.type || 'text'}" value="${esc(v)}"${f.step ? ` step="${f.step}"` : ''}${f.min !== undefined ? ` min="${f.min}"` : ''}${f.max !== undefined ? ` max="${f.max}"` : ''}${f.suggest ? ` list="dl_${f.name}" autocomplete="off"` : ''}>`
      + (f.suggest ? `<datalist id="dl_${f.name}">${f.suggest.map(o => `<option value="${esc(o)}">`).join('')}</datalist>` : '');
  }
  return `<div class="field${f.wide ? ' wide' : ''}"><label for="${id}">${esc(f.label)}${f.required ? ' *' : ''}</label>${input}${f.help ? `<small>${esc(f.help)}</small>` : ''}</div>`;
}
function readForm(root, fields) {
  const out = {};
  for (const f of fields) {
    const el = root.querySelector(`[name="${f.name}"]`);
    let v = f.type === 'checkbox' ? el.checked : el.value.trim();
    if (f.type === 'number') v = v === '' ? null : Number(v);
    if (f.type !== 'checkbox' && v === '') v = null;
    if (f.required && (v === null || (typeof v === 'number' && Number.isNaN(v)))) {
      toast(`${f.label} is required`, 'error'); el.focus(); return null;
    }
    out[f.name] = v;
  }
  return out;
}
function formModal(title, fields, onSave, extraHTML = '') {
  openModal(`<h3>${esc(title)}</h3><form class="form" onsubmit="return false">${fields.map(fieldHTML).join('')}</form>${extraHTML}`,
    [{ label: 'Save', primary: true, onClick: async root => {
      const v = readForm(root, fields);
      if (v === null) return;
      await onSave(v);
      closeModal();
    } }]);
}
function confirmBox(title, msg, onYes, yesLabel = 'Delete') {
  openModal(`<h3>${esc(title)}</h3><p>${esc(msg)}</p>`, [{ label: yesLabel, danger: true, onClick: async () => { await onYes(); closeModal(); } }]);
}

PAGES.dashboard = async () => {
  const m = main();
  if (!S.years.length || !S.subjects.length) {
    m.innerHTML = `<h1>Dashboard</h1><p class="sub">${esc(S.school.name)}</p>${needSetup('Add a school year, its quarters and your subjects in Settings to get started.')}`;
    return;
  }
  const natRows = await run(sb.from('students').select('nationality').eq('is_active', true));
  const nats = [...new Set(natRows.map(r => r.nationality).filter(Boolean))].sort();
  if (S.sel.nationality && !nats.includes(S.sel.nationality)) S.sel.nationality = '';
  const natSelect = `<label>Nationality<select id="natF"><option value="">All nationalities</option>${nats.map(n => `<option value="${esc(n)}" ${n === S.sel.nationality ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></label>`;
  m.innerHTML = `<h1>Dashboard</h1><p class="sub">Where students stand this quarter, by subject.</p>${ctxBar(['year', 'quarter', 'subject']).replace('</div>', natSelect + '</div>')}<div id="dash"><div class="empty">Loading…</div></div>`;
  bindCtx(m, PAGES.dashboard);
  $('#natF').onchange = e => { S.sel.nationality = e.target.value; PAGES.dashboard(); };
  const NAT = S.sel.nationality || '';
  const T = S.sel.termId, SUB = S.sel.subjectId;
  if (!T || !SUB) { $('#dash').innerHTML = needSetup('Add quarters for this school year in Settings → Years & terms.'); return; }

  let [res, enr, dec] = await Promise.all([
    run(sb.from('quarter_results').select('student_id,status,suggested_action,lights,quarter_score,level_id,students(student_code,first_name,last_name,nationality)').eq('term_id', T).eq('subject_id', SUB)),
    run(sb.from('enrollments').select('student_id,level_id,classes!inner(subject_id),students(nationality)').eq('term_id', T).eq('classes.subject_id', SUB)),
    run(sb.from('placement_decisions').select('student_id').eq('term_id', T).eq('subject_id', SUB))
  ]);
  if (NAT) {
    res = res.filter(r => r.students?.nationality === NAT);
    enr = enr.filter(e => e.students?.nationality === NAT);
  }
  const decided = new Set(dec.map(d => d.student_id));
  const students = new Set(enr.map(e => e.student_id));
  const scores = res.map(r => r.quarter_score).filter(v => v !== null).map(Number);
  const avg = scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : null;
  const count = f => res.filter(f).length;
  const waiting = res.filter(r => r.suggested_action && !decided.has(r.student_id));

  const levelRows = S.levels.map(l => ({ name: l.name, n: new Set(enr.filter(e => e.level_id === l.id).map(e => e.student_id)).size }));
  const maxLevel = Math.max(1, ...levelRows.map(l => l.n));
  const fields = [['academic', 'Academic'], ['skills', 'Skills'], ['map', 'MAP'], ['engagement', 'Engagement']];
  const colors = { green: 'var(--green)', yellow: 'var(--amber)', red: 'var(--red)', none: 'var(--none)' };
  const lightBar = key => {
    const c = { green: 0, yellow: 0, red: 0, none: 0 };
    res.forEach(r => { const v = (r.lights || {})[key] || 'none'; c[v] = (c[v] || 0) + 1; });
    const total = res.length || 1;
    return `<div class="bar" title="green ${c.green}, yellow ${c.yellow}, red ${c.red}, no data ${c.none}">${['green', 'yellow', 'red', 'none'].map(k => c[k] ? `<i style="width:${100 * c[k] / total}%;background:${colors[k]}"></i>` : '').join('')}</div>`;
  };
  const attention = res.filter(r => ['at_risk', 'check_not_met'].includes(r.status) || (r.suggested_action && !decided.has(r.student_id)));

  $('#dash').innerHTML = `
    <div class="stats">
      <div class="stat"><b>${students.size}</b><span>Students in this subject${NAT ? ' (' + esc(NAT) + ')' : ''}</span></div>
      <div class="stat"><b>${avg === null ? '—' : fmt(avg)}</b><span>Average Quarter Score</span></div>
      <div class="stat"><b>${count(r => ['ready_up', 'ap_candidate'].includes(r.status))}</b><span>${esc(label('statuses', 'ready_up'))} or ${esc(label('statuses', 'ap_candidate'))}</span></div>
      <div class="stat"><b>${count(r => r.status === 'at_risk')}</b><span>${esc(label('statuses', 'at_risk'))}</span></div>
      <div class="stat"><b>${waiting.length}</b><span>Suggestions waiting for a decision</span></div>
    </div>
    ${!res.length ? `<div class="note">No results calculated for this quarter yet. Enter scores, then press <b>Calculate</b> on the <a href="#/placement">Placement</a> page.</div>` : ''}
    <div class="two">
      <div class="panel"><h2 style="margin-bottom:14px">Status lights</h2>
        <div class="bars">${fields.map(([k, n]) => `<span>${n}</span>${lightBar(k)}`).join('')}</div>
        <div class="legend"><span><i class="dot green"></i>Green</span><span><i class="dot yellow"></i>Yellow</span><span><i class="dot red"></i>Red</span><span><i class="dot"></i>No data</span></div>
      </div>
      <div class="panel"><h2 style="margin-bottom:14px">Students by level</h2>
        <div class="bars">${levelRows.map(l => `<span>${esc(l.name)}</span><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="flex:1"><i style="width:${100 * l.n / maxLevel}%;background:var(--board)"></i></div><span class="num" style="min-width:28px">${l.n}</span></div>`).join('')}</div>
      </div>
    </div>
    <div class="panel"><div class="sec-head"><h2>Needs attention</h2><a href="#/placement">Open placement</a></div>
      ${tableHTML([
        { label: 'Student', val: r => `${studentName(r.students)} (${r.students?.student_code || ''})` },
        { label: 'Nationality', val: r => r.students?.nationality },
        { label: 'Level', val: r => nameOf(S.levels, r.level_id) },
        { label: 'Score', num: true, val: r => r.quarter_score },
        { label: 'Status', html: r => `<span class="pill ${esc(r.status)}">${esc(label('statuses', r.status))}</span>` },
        { label: 'Suggestion', val: r => r.suggested_action ? label('actions', r.suggested_action) : '' },
        { label: 'Lights', html: r => lightsHTML(r.lights) }
      ], attention, { empty: 'No students need attention right now.' })}
    </div>`;
};

    <div id="plc"><div class="empty">Loading…</div></div>`;

  const latest = {};
  decs.forEach(d => { if (!latest[d.student_id]) latest[d.student_id] = d; });
  res.sort((a, b) => (a.students?.last_name || '').localeCompare(b.students?.last_name || ''));

  let filter = '';

        <option value="">All students</option>
        <option value="waiting" ${filter === 'waiting' ? 'selected' : ''}>Waiting for a decision</option>
        ${['ready_up', 'ap_candidate', 'on_track', 'at_risk', 'check_not_met', 'incomplete'].map(s => `<option value="${s}" ${filter === s ? 'selected' : ''}>${esc(label('statuses', s))}</option>`).join('')}
      </select></label></div>${exportButtons('expPl')}</div>
      ${tableHTML([
        { label: 'ID', val: r => r.students?.student_code },
        { label: 'Student', val: r => studentName(r.students) },
        { label: 'Level', val: r => nameOf(S.levels, r.level_id) },
        { label: 'Written', num: true, val: r => r.written_pct },
        { label: 'Oral', num: true, val: r => r.oral_pct },
        { label: 'Practical', num: true, val: r => r.practical_pct },
        { label: 'Quarter score', num: true, html: r => `<b>${esc(fmt(r.quarter_score))}</b>` },
        { label: 'Status', html: r => `<span class="pill ${esc(r.status)}">${esc(label('statuses', r.status))}</span>` },
        { label: 'Lights', html: r => lightsHTML(r.lights) },
        { label: 'Suggestion', html: r => r.suggested_action ? `${esc(label('actions', r.suggested_action))}${r.suggested_level_id ? ' → <b>' + esc(nameOf(S.levels, r.suggested_level_id)) + '</b>' : ''}${r.challenge_pct !== null ? ` <small>(challenge ${esc(fmt(r.challenge_pct))}%)</small>` : ''}` : '' },
        { label: 'Decision', html: r => { const d = latest[r.student_id]; return d ? `<span class="pill ${d.decision}">${esc(label('decisions', d.decision))}</span> ${esc(nameOf(S.levels, d.final_level_id))}` : ''; } },
        ...(canDecide ? [{ label: '', html: (r, i) => `<button class="btn small ghost" data-dec="${res.indexOf(r)}">Decide</button>` }] : [])
      ], rows, { empty: res.length ? 'No students match this filter.' : 'No results yet for this quarter. Enter scores, then press Calculate.' })}`;
    $('#flt').onchange = e => { filter = e.target.value; draw(); };
    bindExport($('#plc'), 'expPl', 'Placement', () => ({
      title: `Placement – ${nameOf(S.subjects, SUB)} – ${nameOf(S.terms, T)}`,
      head: ['Student ID', 'Student', 'Level', 'Written %', 'Oral %', 'Practical %', 'Quarter score', 'Status', 'Suggestion', 'Suggested level', 'Decision', 'Final level', 'Reason'],
      body: rows.map(r => { const d = latest[r.student_id]; return [r.students?.student_code, studentName(r.students), nameOf(S.levels, r.level_id), r.written_pct, r.oral_pct, r.practical_pct, r.quarter_score, label('statuses', r.status), r.suggested_action ? label('actions', r.suggested_action) : '', nameOf(S.levels, r.suggested_level_id), d ? label('decisions', d.decision) : '', d ? nameOf(S.levels, d.final_level_id) : '', d?.reason || '']; })
    }));
    document.querySelectorAll('[data-dec]').forEach(b => { b.onclick = () => decide(res[b.dataset.dec], latest[res[b.dataset.dec].student_id]); });
  };

  const decide = (r, prev) => {
    const lv = S.levels.filter(l => l.is_active).map(l => ({ value: l.id, label: l.name }));
    const decisions = ['approve', 'hold', 'override'].map(d => ({ value: d, label: label('decisions', d) }));
    formModal(`Decision for ${studentName(r.students)}`, [
      { name: 'decision', label: 'Decision', type: 'select', options: decisions, value: prev?.decision || (r.suggested_level_id ? 'approve' : 'hold'), required: true },
      { name: 'final_level_id', label: 'Level from next quarter', type: 'select', options: lv, value: prev?.final_level_id || r.suggested_level_id || r.level_id, required: true, help: 'Approve = suggested level, Hold = stays, Override = your choice' },
      { name: 'reason', label: 'Reason or note', type: 'textarea', wide: true, value: prev?.reason || '' }
    ], async v => {
      let final = v.final_level_id;
      if (v.decision === 'approve') final = r.suggested_level_id || r.level_id;
      if (v.decision === 'hold') final = r.level_id;
      if (v.decision === 'override' && !v.reason) { toast('Please give a reason for an override', 'error'); throw new Error('reason'); }
      await run(sb.from('placement_decisions').insert({
        school_id: S.school.id, student_id: r.student_id, subject_id: SUB, term_id: T,
        from_level_id: r.level_id, suggested_level_id: r.suggested_level_id, decision: v.decision,
        final_level_id: final, reason: v.reason, decided_by: S.user.id
      }));
      toast('Decision saved');
      PAGES.placement();
    }, `<p class="help" style="margin-top:12px">Current level: <b>${esc(nameOf(S.levels, r.level_id))}</b>. Suggested: <b>${esc(nameOf(S.levels, r.suggested_level_id) || 'no change')}</b>. The new level is used when next quarter's class list is copied (Classes → Copy from previous quarter).</p>`);
  };
  draw();
};

PAGES.scores = async () => {
  const m = main();
  if (!S.years.length) { m.innerHTML = `<h1>Assessments & scores</h1>${needSetup('Add a school year and quarters in Settings first.')}`; return; }
  const classes = await run(sb.from('classes').select('*').eq('academic_year_id', S.sel.yearId).order('name'));
  if (!S.sel.classId || !byId(classes, S.sel.classId)) S.sel.classId = classes[0]?.id || null;
  const T = S.sel.termId, C = S.sel.classId;
  m.innerHTML = `<h1>Assessments & scores</h1><p class="sub">Only exams and practicals are entered here. Homework and practice are not part of the evaluation.</p>
    ${ctxBar(['year', 'quarter', 'class'], { classes })}<div id="sc"><div class="empty">Loading…</div></div>`;
  bindCtx(m, PAGES.scores);
  if (!classes.length) { $('#sc').innerHTML = `<div class="empty">No classes in this school year yet. ${isAdmin() || isCoord() ? '<a href="#/classes">Add a class</a>' : 'Ask your coordinator to add your classes.'}</div>`; return; }
  if (!T) { $('#sc').innerHTML = needSetup('Add quarters for this school year in Settings → Years & terms.'); return; }

  const cls = byId(classes, C);
  const [assess, enr] = await Promise.all([
    run(sb.from('assessments').select('*').eq('class_id', C).eq('term_id', T).order('assessed_on', { ascending: true, nullsFirst: false }).order('created_at')),
    run(sb.from('enrollments').select('id,student_id,level_id,students(student_code,first_name,last_name)').eq('class_id', C).eq('term_id', T))
  ]);
  enr.sort((a, b) => (a.students?.last_name || '').localeCompare(b.students?.last_name || ''));
  const scores = assess.length ? await run(sb.from('scores').select('*').in('assessment_id', assess.map(a => a.id))) : [];
  const scoreOf = (aid, sid) => scores.find(s => s.assessment_id === aid && s.student_id === sid);
  const typeName = id => nameOf(S.types, id);
  const catOf = id => byId(S.types, id)?.category || '';

  $('#sc').innerHTML = `
    <div class="panel"><div class="sec-head"><h2>Assessments in ${esc(nameOf(S.terms, T))}</h2>
      <button class="btn primary" id="addA">Add assessment</button></div>
      ${tableHTML([
        { label: 'Title', key: 'title' },
        { label: 'Type', val: a => `${typeName(a.type_id)} (${catOf(a.type_id)})` },
        { label: 'Paper level', val: a => a.level_id ? nameOf(S.levels, a.level_id) : 'All levels' },
        { label: 'Total marks', num: true, key: 'total_marks' },
        { label: 'Date', key: 'assessed_on' },
        { label: '', html: (a, i) => `<button class="btn small ghost" data-ea="${i}">Edit</button> <button class="btn small ghost danger-text" data-da="${i}">Delete</button>` }
      ], assess, { empty: 'No assessments yet for this class and quarter.' })}
    </div>
    <div class="panel"><div class="sec-head"><h2>Gradebook: ${esc(cls.name)}</h2>
      <div class="tools"><button class="btn ghost small" id="tplS">Template</button><button class="btn ghost small" id="impS">Import</button>${exportButtons('expS')}<button class="btn primary" id="saveS">Save scores</button></div></div>
      <p class="help">Type the marks earned. Leave a box empty if the student did not take it. Changed boxes turn yellow until you save.</p>
      ${!enr.length ? `<div class="empty">No students in this class for this quarter. Add them on the <a href="#/classes/${C}">class page</a>.</div>` : !assess.length ? '<div class="empty">Add an assessment above to start entering scores.</div>' : `
      <div class="tbl-wrap"><table><thead><tr><th>Student</th><th>Level</th>${assess.map(a => `<th class="num" title="${esc(typeName(a.type_id))}">${esc(a.title)}<br><small>/ ${esc(fmt(Number(a.total_marks)))}</small></th>`).join('')}</tr></thead>
      <tbody>${enr.map(e => `<tr><td>${esc(studentName(e.students))} <small>${esc(e.students?.student_code || '')}</small></td><td>${esc(nameOf(S.levels, e.level_id))}</td>
        ${assess.map(a => { const s = scoreOf(a.id, e.student_id); const v = s ? Number(s.marks) : ''; return `<td class="num"><input class="grid-input" inputmode="decimal" data-a="${a.id}" data-s="${e.student_id}" data-max="${a.total_marks}" data-orig="${v}" value="${v}" aria-label="${esc(a.title)} for ${esc(studentName(e.students))}"></td>`; }).join('')}</tr>`).join('')}
      </tbody></table></div>`}
    </div>`;

  // assessments add/edit/delete
  const aFields = a => [
    { name: 'title', label: 'Title', required: true, value: a.title, wide: true },
    { name: 'type_id', label: 'Type', type: 'select', required: true, value: a.type_id, options: S.types.filter(t => t.is_active || t.id === a.type_id).map(t => ({ value: t.id, label: `${t.name} (${t.category})` })) },
    { name: 'level_id', label: 'Paper level', type: 'select', blank: 'All levels (same paper)', value: a.level_id, options: S.levels.map(l => ({ value: l.id, label: l.name })), help: 'Pick a level if this paper is only for that level, e.g. an AP challenge paper.' },
    { name: 'total_marks', label: 'Total marks', type: 'number', required: true, min: 1, step: 'any', value: a.total_marks },
    { name: 'assessed_on', label: 'Date', type: 'date', value: a.assessed_on }
  ];
  $('#addA').onclick = () => formModal('Add assessment', aFields({}), async v => {
    await run(sb.from('assessments').insert({ school_id: S.school.id, class_id: C, term_id: T, ...v }));
    toast('Assessment added'); PAGES.scores();
  });
  document.querySelectorAll('[data-ea]').forEach(b => { b.onclick = () => {
    const a = assess[b.dataset.ea];
    formModal('Edit assessment', aFields(a), async v => { await run(sb.from('assessments').update(v).eq('id', a.id)); toast('Saved'); PAGES.scores(); });
  }; });
  document.querySelectorAll('[data-da]').forEach(b => { b.onclick = () => {
    const a = assess[b.dataset.da];
    confirmBox(`Delete “${a.title}”?`, 'All scores entered for this assessment will also be deleted.', async () => {
      await run(sb.from('assessments').delete().eq('id', a.id)); toast('Deleted'); PAGES.scores();
    });
  }; });

  // grid editing
  document.querySelectorAll('.grid-input').forEach(inp => {
    inp.oninput = () => {
      const v = inp.value.trim();
      const bad = v !== '' && (isNaN(Number(v)) || Number(v) < 0 || Number(v) > Number(inp.dataset.max));
      inp.classList.toggle('bad', bad);
      inp.classList.toggle('changed', v !== inp.dataset.orig);
      inp.title = bad ? `Must be between 0 and ${inp.dataset.max}` : '';
    };
  });
  const saveBtn = $('#saveS');
  saveBtn.onclick = async () => {
    const changed = [...document.querySelectorAll('.grid-input.changed')];
    if (!changed.length) { toast('No changes to save'); return; }
    if (document.querySelector('.grid-input.bad')) { toast('Fix the red boxes first', 'error'); return; }
    const upserts = [], deletes = [];
    changed.forEach(inp => {
      const v = inp.value.trim();
      const existing = scoreOf(inp.dataset.a, inp.dataset.s);
      if (v === '') { if (existing) deletes.push(existing.id); }
      else upserts.push({ school_id: S.school.id, assessment_id: inp.dataset.a, student_id: inp.dataset.s, marks: Number(v), entered_by: S.user.id });
    });
    saveBtn.disabled = true;
    try {
      if (upserts.length) await run(sb.from('scores').upsert(upserts, { onConflict: 'assessment_id,student_id' }));
      if (deletes.length) await run(sb.from('scores').delete().in('id', deletes));
      toast(`Saved ${changed.length} score${changed.length === 1 ? '' : 's'}`);
      PAGES.scores();
    } finally { saveBtn.disabled = false; }
  };

  // template / import / export
  const head = ['student_code', 'student_name', ...assess.map(a => a.title)];
  $('#tplS').onclick = () => {
    if (!assess.length) { toast('Add assessments first', 'error'); return; }
    downloadTemplate(`scores-${cls.name}`, head, enr.map(e => [e.students?.student_code, studentName(e.students), ...assess.map(() => '')]));
  };
  $('#impS').onclick = async () => {
    if (!assess.length) { toast('Add assessments first', 'error'); return; }
    const file = await pickFile(); if (!file) return;
    const raw = await readRows(file);
    const byCode = {}; enr.forEach(e => { byCode[String(e.students?.student_code).toLowerCase()] = e; });
    const rows = [], data = [];
    raw.forEach(r => {
      const code = String(r.student_code || '').trim();
      const e = byCode[code.toLowerCase()];
      let error = '', n = 0;
      if (!code) error = 'Missing student_code';
      else if (!e) error = 'Student not in this class for this quarter';
      const marks = [];
      if (!error) {
        for (const a of assess) {
          const val = r[normKey(a.title)];
          if (val === undefined || val === '') continue;
          const num = Number(val);
          if (isNaN(num) || num < 0 || num > Number(a.total_marks)) { error = `${a.title}: ${val} is not between 0 and ${fmt(Number(a.total_marks))}`; break; }
          marks.push({ school_id: S.school.id, assessment_id: a.id, student_id: e.student_id, marks: num, entered_by: S.user.id });
          n++;
        }
      }
      rows.push({ show: { code, marks: n }, data: marks, error });
    });
    importPreview({ title: 'Import scores', file, section: 'Scores', cols: [{ key: 'code', label: 'Student ID' }, { key: 'marks', label: 'Marks found' }], rows,
      onConfirm: async ok => {
        const all = ok.flat();
        if (all.length) await run(sb.from('scores').upsert(all, { onConflict: 'assessment_id,student_id' }));
        toast(`Imported ${all.length} marks`); PAGES.scores();
      } });
  };
  bindExport($('#sc'), 'expS', 'Gradebook', () => ({
    title: `Gradebook – ${cls.name} – ${nameOf(S.terms, T)}`,
    head: ['Student ID', 'Student', 'Level', ...assess.map(a => `${a.title} (/${fmt(Number(a.total_marks))})`)],
    body: enr.map(e => [e.students?.student_code, studentName(e.students), nameOf(S.levels, e.level_id), ...assess.map(a => { const s = scoreOf(a.id, e.student_id); return s ? Number(s.marks) : ''; })])
  }));
};

  ];
  if (canAdd) $('#addC').onclick = () => {
    if (!subjOpts.length) { toast('Add a subject in Settings first', 'error'); return; }

      await run(sb.from('classes').insert({ school_id: S.school.id, academic_year_id: S.sel.yearId, ...v }));
      toast('Class added'); PAGES.classes();
    });
  };
  document.querySelectorAll('[data-ec]').forEach(b => { b.onclick = () => {

    formModal('Edit class', cFields(c), async v => { await run(sb.from('classes').update(v).eq('id', c.id)); toast('Saved'); PAGES.classes(); });

async function classPage(classId) {
  const m = main();
  const cls = await run(sb.from('classes').select('*').eq('id', classId).maybeSingle());
  if (!cls) { m.innerHTML = '<h1>Class not found</h1><p><a href="#/classes">Back to classes</a></p>'; return; }
  if (cls.academic_year_id !== S.sel.yearId) { S.sel.yearId = cls.academic_year_id; S.sel.termId = quartersOf(S.sel.yearId)[0]?.id || null; }
  const T = S.sel.termId;
  const canEdit = canManageSubject(cls.subject_id);
  m.innerHTML = `<p><a href="#/classes">← All classes</a></p><h1>${esc(cls.name)}</h1>
    <p class="sub">${esc(nameOf(S.subjects, cls.subject_id))} · Grade ${esc(cls.grade)} · ${esc(staffName(cls.teacher_id) || 'No teacher')}</p>
    ${ctxBar(['quarter'], { right: canEdit ? '<button class="btn ghost" id="copyPrev">Copy from previous quarter</button><button class="btn primary" id="addSt">Add students</button>' : '' })}
    <div id="cp"></div>`;
  bindCtx(m, () => classPage(classId));
  if (!T) { $('#cp').innerHTML = needSetup('Add quarters for this school year in Settings → Years & terms.'); return; }
  const enr = await run(sb.from('enrollments').select('*,students(student_code,first_name,last_name,grade)').eq('class_id', classId).eq('term_id', T));
  enr.sort((a, b) => (a.students?.last_name || '').localeCompare(b.students?.last_name || ''));
  const levelOpts = sel => S.levels.filter(l => l.is_active || l.id === sel).map(l => `<option value="${l.id}" ${l.id === sel ? 'selected' : ''}>${esc(l.name)}</option>`).join('');

  $('#cp').innerHTML = `<div class="sec-head"><h2>${enr.length} student${enr.length === 1 ? '' : 's'} in ${esc(nameOf(S.terms, T))}</h2>
    <div class="tools">${canEdit ? '<button class="btn ghost small" id="tplE">Template</button><button class="btn ghost small" id="impE">Import</button>' : ''}${exportButtons('expE')}</div></div>
    ${tableHTML([
      { label: 'Student ID', val: e => e.students?.student_code },
      { label: 'Student', val: e => studentName(e.students) },
      { label: 'Level', html: e => canEdit ? `<select data-lv="${e.id}" aria-label="Level">${levelOpts(e.level_id)}</select>` : esc(nameOf(S.levels, e.level_id)) },
      ...(canEdit ? [{ label: '', html: e => `<button class="btn small ghost danger-text" data-rm="${e.id}">Remove</button>` }] : [])
    ], enr, { empty: 'No students in this class for this quarter. Use “Add students” or “Copy from previous quarter”.' })}`;

  bindExport($('#cp'), 'expE', 'Class list', () => ({
    title: `${cls.name} – ${nameOf(S.terms, T)}`,
    head: ['Student ID', 'First name', 'Last name', 'Level'],
    body: enr.map(e => [e.students?.student_code, e.students?.first_name, e.students?.last_name, nameOf(S.levels, e.level_id)])
  }));
  if (!canEdit) return;

  document.querySelectorAll('[data-lv]').forEach(s => { s.onchange = async () => {
    await run(sb.from('enrollments').update({ level_id: s.value }).eq('id', s.dataset.lv)); toast('Level changed');
  }; });
  document.querySelectorAll('[data-rm]').forEach(b => { b.onclick = () => confirmBox('Remove this student from the class?', 'Their scores stay saved, but they will not appear in this quarter’s gradebook.', async () => {
    await run(sb.from('enrollments').delete().eq('id', b.dataset.rm)); toast('Removed'); classPage(classId);
  }, 'Remove'); });

  $('#addSt').onclick = async () => {
    const all = await run(sb.from('students').select('*').eq('grade', cls.grade).eq('is_active', true).order('last_name'));
    const inClass = new Set(enr.map(e => e.student_id));
    const free = all.filter(s => !inClass.has(s.id));
    if (!free.length) { toast(`No more active Grade ${cls.grade} students to add`, 'error'); return; }
    openModal(`<h3>Add students to ${esc(cls.name)}</h3>
      <div class="field"><label for="addLv">Level for these students</label><select id="addLv">${levelOpts(S.levels.find(l => l.is_active)?.id)}</select></div>
      <label class="check" style="margin-top:10px"><input type="checkbox" id="allChk"> Select all (${free.length})</label>
      <div class="picklist">${free.map(s => `<label><input type="checkbox" value="${s.id}"> ${esc(studentName(s))} <small>${esc(s.student_code)}</small></label>`).join('')}</div>`,
      [{ label: 'Add selected', primary: true, onClick: async root => {
        const ids = [...root.querySelectorAll('.picklist input:checked')].map(i => i.value);
        if (!ids.length) { toast('Select at least one student', 'error'); return; }
        const lv = root.querySelector('#addLv').value;
        await run(sb.from('enrollments').insert(ids.map(id => ({ school_id: S.school.id, student_id: id, class_id: classId, term_id: T, level_id: lv }))));
        toast(`Added ${ids.length} student${ids.length === 1 ? '' : 's'}`); closeModal(); classPage(classId);
      } }]);
    $('#allChk').onchange = e => document.querySelectorAll('.picklist input').forEach(i => { i.checked = e.target.checked; });
  };

  $('#copyPrev').onclick = async () => {
    const q = quartersOf(S.sel.yearId);
    const idx = q.findIndex(t => t.id === T);
    if (idx <= 0) { toast('There is no earlier quarter in this school year', 'error'); return; }
    const prev = q[idx - 1];
    const prevEnr = await run(sb.from('enrollments').select('student_id,level_id').eq('class_id', classId).eq('term_id', prev.id));
    if (!prevEnr.length) { toast(`No students in ${prev.name} to copy`, 'error'); return; }
    const decs = await run(sb.from('placement_decisions').select('*').eq('term_id', prev.id).eq('subject_id', cls.subject_id).order('decided_at', { ascending: false }));
    const latest = {}; decs.forEach(d => { if (!latest[d.student_id]) latest[d.student_id] = d; });
    let moved = 0;
    const rows = prevEnr.map(e => {
      const d = latest[e.student_id];
      const lv = d && d.final_level_id ? d.final_level_id : e.level_id;
      if (lv !== e.level_id) moved++;
      return { school_id: S.school.id, student_id: e.student_id, class_id: classId, term_id: T, level_id: lv };
    });
    await run(sb.from('enrollments').upsert(rows, { onConflict: 'student_id,class_id,term_id', ignoreDuplicates: true }));
    toast(`Copied ${rows.length} students from ${prev.name}${moved ? `; ${moved} moved to a new level by department decisions` : ''}`);
    classPage(classId);
  };

  $('#tplE').onclick = () => downloadTemplate('class-list', ['student_code', 'level'], [['S1001', S.levels[0]?.name || 'Regular']]);
  $('#impE').onclick = async () => {
    const file = await pickFile(); if (!file) return;
    const raw = await readRows(file);
    const studs = await run(sb.from('students').select('id,student_code,first_name,last_name'));
    const byCode = {}; studs.forEach(s => { byCode[s.student_code.toLowerCase()] = s; });
    const lvByName = {}; S.levels.forEach(l => { lvByName[l.name.toLowerCase()] = l; });
    const rows = raw.map(r => {
      const code = String(r.student_code || '').trim();
      const st = byCode[code.toLowerCase()];
      const lv = lvByName[String(r.level || '').trim().toLowerCase()];
      let error = '';
      if (!code) error = 'Missing student_code';
      else if (!st) error = 'Student ID not found (add the student first)';
      else if (!lv) error = `Level “${r.level}” not found. Use: ${S.levels.map(l => l.name).join(', ')}`;
      return { show: { code, name: studentName(st), level: r.level }, data: st && lv ? { school_id: S.school.id, student_id: st.id, class_id: classId, term_id: T, level_id: lv.id } : null, error };
    });
    importPreview({ title: 'Import class list', file, section: 'Class list', rows,
      cols: [{ key: 'code', label: 'Student ID' }, { key: 'name', label: 'Student' }, { key: 'level', label: 'Level' }],
      onConfirm: async ok => { await run(sb.from('enrollments').upsert(ok, { onConflict: 'student_id,class_id,term_id' })); toast(`Imported ${ok.length} students`); classPage(classId); } });
  };
}

    <div id="stl"></div>`;
  const all = await run(sb.from('students').select('*').order('last_name').order('first_name'));
  const grades = [...new Set(all.map(s => s.grade))].sort((a, b) => a - b);
  $('#gr').innerHTML += grades.map(g => `<option value="${g}">Grade ${g}</option>`).join('');
  const nats = [...new Set(all.map(s => s.nationality).filter(Boolean))].sort();
  $('#nat').innerHTML += nats.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
  const fields = s => [
    { name: 'student_code', label: 'Student ID', required: true, value: s.student_code },
    { name: 'grade', label: 'Grade', type: 'number', required: true, min: 1, max: 12, value: s.grade },
    { name: 'first_name', label: 'First name', required: true, value: s.first_name },
    { name: 'last_name', label: 'Last name', required: true, value: s.last_name },
    { name: 'nationality', label: 'Nationality', value: s.nationality, suggest: nats, help: 'e.g. Indian, Chinese, Korean. Used for reporting only.' },
    { name: 'is_active', label: 'Active', type: 'checkbox', value: s.id ? s.is_active : true, checkLabel: 'Currently at the school' }
  ];
  const draw = () => {
    const q = $('#q').value.trim().toLowerCase(), g = $('#gr').value, a = $('#act').value, n = $('#nat').value;
    const rows = all.filter(s => (!q || `${s.first_name} ${s.last_name} ${s.student_code}`.toLowerCase().includes(q)) && (!g || String(s.grade) === g) && (!n || s.nationality === n) && (a === '' || String(+s.is_active) === a));
    $('#stl').innerHTML = `<div class="sec-head"><span>${rows.length} student${rows.length === 1 ? '' : 's'}</span>${exportButtons('expStu')}</div>` + tableHTML([
      { label: 'Student ID', key: 'student_code' },
      { label: 'First name', key: 'first_name' },
      { label: 'Last name', key: 'last_name' },
      { label: 'Grade', num: true, key: 'grade' },
      { label: 'Nationality', key: 'nationality' },
      { label: 'Active', val: s => yesNo(s.is_active) },
      { label: '', html: s => `<button class="btn small ghost" data-es="${s.id}">Edit</button>` }
    ], rows, { empty: all.length ? 'No students match.' : 'No students yet. Add one, or import your list from Excel or CSV.' });
    bindExport($('#stl'), 'expStu', 'Students', () => ({ title: 'Students', head: ['student_code', 'first_name', 'last_name', 'grade', 'nationality', 'active'], body: rows.map(s => [s.student_code, s.first_name, s.last_name, s.grade, s.nationality, yesNo(s.is_active)]) }));
    document.querySelectorAll('[data-es]').forEach(b => { b.onclick = () => {
      const s = byId(all, b.dataset.es);
      formModal('Edit student', fields(s), async v => { await run(sb.from('students').update(v).eq('id', s.id)); toast('Saved'); PAGES.students(); });
    }; });
  };
  ['q', 'gr', 'act', 'nat'].forEach(id => { $('#' + id).oninput = draw; $('#' + id).onchange = draw; });
  $('#addStu').onclick = () => formModal('Add student', fields({}), async v => {
    await run(sb.from('students').insert({ school_id: S.school.id, ...v })); toast('Student added'); PAGES.students();
  });
  $('#tplStu').onclick = () => downloadTemplate('students', ['student_code', 'first_name', 'last_name', 'grade', 'nationality'], [['S1001', 'Aarav', 'Sharma', 7, 'Indian']]);
  $('#impStu').onclick = async () => {
    const file = await pickFile(); if (!file) return;
    const raw = await readRows(file);
    const seen = new Set();
    const rows = raw.map(r => {
      const code = String(r.student_code || '').trim();
      const grade = Number(r.grade);
      let error = '';
      if (!code) error = 'Missing student_code';
      else if (seen.has(code.toLowerCase())) error = 'Duplicate Student ID in file';
      else if (!r.first_name || !r.last_name) error = 'Missing first or last name';
      else if (!Number.isInteger(grade) || grade < 1 || grade > 12) error = 'Grade must be a whole number 1–12';
      seen.add(code.toLowerCase());
      const exists = all.some(s => s.student_code.toLowerCase() === code.toLowerCase());
      const data = { school_id: S.school.id, student_code: code, first_name: r.first_name, last_name: r.last_name, grade, is_active: true };
      if (r.nationality !== undefined && r.nationality !== '') data.nationality = r.nationality;
      return { show: { code, name: `${r.first_name || ''} ${r.last_name || ''}`, grade: r.grade, nat: r.nationality || '', what: exists ? 'Update' : 'New' }, data, error };
    });
    importPreview({ title: 'Import students', file, section: 'Students', rows,
      cols: [{ key: 'code', label: 'Student ID' }, { key: 'name', label: 'Name' }, { key: 'grade', label: 'Grade' }, { key: 'nat', label: 'Nationality' }, { key: 'what', label: 'Action' }],
      onConfirm: async ok => { await run(sb.from('students').upsert(ok, { onConflict: 'school_id,student_code' })); toast(`Imported ${ok.length} students`); PAGES.students(); } });
  };
  draw();
};
