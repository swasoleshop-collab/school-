async function tabYears(el) {
  if (!S.years.length) S.sel.yearId = null;
  const yid = S.sel.yearId;
  const terms = termsOfYear(yid).sort((a, b) => a.term_type.localeCompare(b.term_type) || a.sequence - b.sequence);
  el.innerHTML = `<div class="panel"><div class="sec-head"><h2>School years</h2><button class="btn primary" id="addY">Add school year</button></div>
    ${tableHTML([
      { label: 'Year', key: 'name' }, { label: 'Starts', key: 'starts_on' }, { label: 'Ends', key: 'ends_on' },
      { label: 'Current year', val: r => r.is_current ? 'Yes' : '' },
      { label: '', html: (r, i) => `<button class="btn small ghost" data-ey="${i}">Edit</button> <button class="btn small ghost danger-text" data-dy="${i}">Delete</button>` }
    ], S.years, { empty: 'No school years yet. Add the current one to get started.' })}</div>
    ${S.years.length ? `<div class="panel"><div class="sec-head"><h2>Terms in <select id="tyear" aria-label="School year">${S.years.map(y => `<option value="${y.id}" ${y.id === yid ? 'selected' : ''}>${esc(y.name)}</option>`).join('')}</select></h2>
      <div class="tools">${!terms.length ? '<button class="btn ghost" id="genT">Create 4 quarters and 2 semesters</button>' : ''}<button class="btn primary" id="addT">Add term</button></div></div>
      <p class="help">Quarters are used for scores and placement. Semesters are used for the tentative and final view. Dates must not overlap within the same type.</p>
      ${tableHTML([
        { label: 'Term', key: 'name' }, { label: 'Type', key: 'term_type' }, { label: 'Order', num: true, key: 'sequence' },
        { label: 'Starts', key: 'starts_on' }, { label: 'Ends', key: 'ends_on' },
        { label: '', html: (r, i) => `<button class="btn small ghost" data-et="${i}">Edit</button> <button class="btn small ghost danger-text" data-dt="${i}">Delete</button>` }
      ], terms, { empty: 'No terms yet. Use “Create 4 quarters and 2 semesters” to split the year automatically, then adjust the dates.' })}</div>` : ''}`;

  const reload = async () => { await loadLookups(); tabYears(el); };
  const yFields = y => [
    { name: 'name', label: 'Name', required: true, value: y.name, help: 'e.g. 2026-27' },
    { name: 'is_current', label: 'Current', type: 'checkbox', value: y.is_current, checkLabel: 'This is the current school year' },
    { name: 'starts_on', label: 'Starts', type: 'date', required: true, value: y.starts_on },
    { name: 'ends_on', label: 'Ends', type: 'date', required: true, value: y.ends_on }
  ];
  const saveYear = async (v, id) => {
    if (v.ends_on <= v.starts_on) { toast('The end date must be after the start date', 'error'); throw new Error('dates'); }
    if (v.is_current) await run(sb.from('academic_years').update({ is_current: false }).eq('school_id', S.school.id).neq('id', id || '00000000-0000-0000-0000-000000000000'));
    if (id) await run(sb.from('academic_years').update(v).eq('id', id));
    else { const y = await run(sb.from('academic_years').insert({ school_id: S.school.id, ...v }).select().single()); S.sel.yearId = y.id; }
    toast('Saved'); reload();
  };
  $('#addY').onclick = () => formModal('Add school year', yFields({ is_current: !S.years.length }), v => saveYear(v));
  el.querySelectorAll('[data-ey]').forEach(b => { b.onclick = () => { const y = S.years[b.dataset.ey]; formModal('Edit school year', yFields(y), v => saveYear(v, y.id)); }; });
  el.querySelectorAll('[data-dy]').forEach(b => { b.onclick = () => { const y = S.years[b.dataset.dy]; confirmBox(`Delete ${y.name}?`, 'Its terms are deleted too. A year that already has classes cannot be deleted.', async () => { await run(sb.from('academic_years').delete().eq('id', y.id)); S.sel.yearId = null; toast('Deleted'); reload(); }); }; });
  if (!S.years.length) return;

  $('#tyear').onchange = e => { S.sel.yearId = e.target.value; S.sel.termId = null; tabYears(el); };
  const tFields = t => [
    { name: 'name', label: 'Name', required: true, value: t.name, help: 'e.g. Quarter 1' },
    { name: 'term_type', label: 'Type', type: 'select', required: true, value: t.term_type || 'quarter', options: [{ value: 'quarter', label: 'Quarter' }, { value: 'semester', label: 'Semester' }] },
    { name: 'sequence', label: 'Order in the year', type: 'number', required: true, min: 1, value: t.sequence },
    { name: 'starts_on', label: 'Starts', type: 'date', required: true, value: t.starts_on },
    { name: 'ends_on', label: 'Ends', type: 'date', required: true, value: t.ends_on }
  ];
  const saveTerm = async (v, id) => {
    if (v.ends_on <= v.starts_on) { toast('The end date must be after the start date', 'error'); throw new Error('dates'); }
    if (id) await run(sb.from('terms').update(v).eq('id', id));
    else await run(sb.from('terms').insert({ school_id: S.school.id, academic_year_id: yid, ...v }));
    toast('Saved'); reload();
  };
  $('#addT').onclick = () => formModal('Add term', tFields({}), v => saveTerm(v));
  el.querySelectorAll('[data-et]').forEach(b => { b.onclick = () => { const t = terms[b.dataset.et]; formModal('Edit term', tFields(t), v => saveTerm(v, t.id)); }; });
  el.querySelectorAll('[data-dt]').forEach(b => { b.onclick = () => { const t = terms[b.dataset.dt]; confirmBox(`Delete ${t.name}?`, 'A term that already has scores or class lists cannot be deleted.', async () => { await run(sb.from('terms').delete().eq('id', t.id)); toast('Deleted'); reload(); }); }; });

  const gen = $('#genT');
  if (gen) gen.onclick = async () => {
    const y = byId(S.years, yid);
    const d0 = new Date(y.starts_on + 'T00:00:00Z'), d1 = new Date(y.ends_on + 'T00:00:00Z');
    const days = Math.round((d1 - d0) / 86400000);
    const at = f => { const d = new Date(d0.getTime() + Math.round(days * f) * 86400000); return d.toISOString().slice(0, 10); };
    const prevDay = s => new Date(new Date(s + 'T00:00:00Z').getTime() - 86400000).toISOString().slice(0, 10);
    const qStart = [y.starts_on, at(0.25), at(0.5), at(0.75)];
    const qEnd = [prevDay(qStart[1]), prevDay(qStart[2]), prevDay(qStart[3]), y.ends_on];
    const rows = qStart.map((s, i) => ({ school_id: S.school.id, academic_year_id: yid, name: `Quarter ${i + 1}`, term_type: 'quarter', sequence: i + 1, starts_on: s, ends_on: qEnd[i] }));
    rows.push({ school_id: S.school.id, academic_year_id: yid, name: 'Semester 1', term_type: 'semester', sequence: 1, starts_on: qStart[0], ends_on: qEnd[1] });
    rows.push({ school_id: S.school.id, academic_year_id: yid, name: 'Semester 2', term_type: 'semester', sequence: 2, starts_on: qStart[2], ends_on: qEnd[3] });
    await run(sb.from('terms').insert(rows));
    toast('6 terms created. Adjust the dates to match your calendar.'); reload();
  };
}

// ---- Rules & weights ----
const RULE_GROUPS = [
  { title: 'Exam score', help: 'How written and oral exams combine. Must add up to 100%.', sum: ['weights.written', 'weights.oral'],
    items: [['weights.written', 'Written exams', 'pct'], ['weights.oral', 'Oral exams', 'pct']] },
  { title: 'Quarter Score', help: 'How the exam score and practicals combine. Must add up to 100%.', sum: ['weights.exam', 'weights.practical'],
    items: [['weights.exam', 'Exams (written + oral)', 'pct'], ['weights.practical', 'Practicals, projects, research, presentations', 'pct']] },
  { title: 'Final composite (end of year)', help: 'How Semester 1 and Semester 2 combine. Must add up to 100%.', sum: ['weights.semester1', 'weights.semester2'],
    items: [['weights.semester1', 'Semester 1', 'pct'], ['weights.semester2', 'Semester 2', 'pct']] },
  { title: 'Placement rules', help: '',
    items: [['placement.consecutive_quarters', 'Quarters in a row before a move is suggested', 'int'], ['placement.ap_challenge_pass', 'AP challenge pass mark (%)', 'num']] },
  { title: 'Checks before moving up', help: 'Optional extra conditions. A student who fails a check shows as needing review.',
    items: [['checks.map_enabled', 'Require a minimum MAP percentile (MAP subjects only)', 'bool'], ['checks.map_min_percentile', 'Minimum MAP percentile', 'num'],
            ['checks.skills_enabled', 'Require a minimum skills average', 'bool'], ['checks.skills_min', 'Minimum skills average (1–4)', 'num']] },
  { title: 'Status lights', help: 'When each light turns green, yellow or red.',
    items: [['lights.academic_margin', 'Academic: yellow zone above the red line, and the drop since last quarter that turns it yellow (points)', 'num'],
            ['lights.academic_red_below', 'Academic: red below this score (levels with no move-down line)', 'num'],
            ['lights.skills_green', 'Skills: green at or above', 'num'], ['lights.skills_yellow', 'Skills: yellow at or above', 'num'],
            ['lights.map_green', 'MAP: green at or above this percentile', 'num'], ['lights.map_red', 'MAP: red below this percentile', 'num']] },
  { title: 'Early warning (never affects placement)', help: '',
    items: [['early_warning.attendance_pct', 'Flag when quarter attendance is at or below (%)', 'num'], ['early_warning.behavior_count', 'Flag at this many behavior incidents in a quarter', 'int']] }
];
const LEVEL_KEYS = [['placement.move_up', 'Move up at or above'], ['placement.ap_candidate', 'AP Candidate at or above'], ['placement.move_down', 'Move down below']];
const ruleScope = { subject: undefined, eff: '' };

async function tabRules(el) {
  const all = await run(sb.from('settings').select('*'));
  const scopes = [...(isAdmin() ? [{ value: '', label: 'Whole school (default for every subject)' }] : []),
    ...S.subjects.filter(s => canManageSubject(s.id)).map(s => ({ value: s.id, label: `${s.name} only` }))];
  if (!scopes.length) { el.innerHTML = '<div class="empty">You are not a coordinator for any subject yet.</div>'; return; }
  if (ruleScope.subject === undefined || !scopes.some(o => o.value === ruleScope.subject)) ruleScope.subject = scopes[0].value;
  const scope = ruleScope.subject || null, eff = ruleScope.eff || null;
  const isBase = !scope && !eff;
  const allTerms = [...S.terms].sort((a, b) => a.starts_on.localeCompare(b.starts_on));

  const own = (key, level = null) => all.find(r => r.key === key && (r.subject_id || null) === scope && (r.level_id || null) === level && r.grade == null && (r.effective_from_term || null) === eff);
  const baseRow = (key, level = null, subj = null) => all.find(r => r.key === key && (r.subject_id || null) === subj && (r.level_id || null) === level && r.grade == null && !r.effective_from_term);
  const inherited = (key, level = null) => {
    if (isBase) return null;
    const r = (scope && eff ? baseRow(key, level, scope) : null) || baseRow(key, level, null);
    return r ? r.value : null;
  };
  const toDisp = (kind, v) => v === null || v === undefined ? '' : kind === 'pct' ? String(Math.round(Number(v) * 10000) / 100) : String(v);
  const unit = kind => kind === 'pct' ? '%' : '';
  const inputFor = (key, kind, level = null) => {
    const r = own(key, level);
    const val = r ? toDisp(kind, r.value) : '';
    const inh = inherited(key, level);
    const attrs = `data-key="${key}" data-kind="${kind}" data-level="${level || ''}"`;
    if (kind === 'bool') {
      return `<select ${attrs}>${isBase ? '' : `<option value="" ${val === '' ? 'selected' : ''}>Use default</option>`}<option value="true" ${val === 'true' ? 'selected' : ''}>Yes</option><option value="false" ${val === 'false' || (isBase && val === '') ? 'selected' : ''}>No</option></select>`;
    }
    return `<input type="number" step="any" ${attrs} value="${esc(val)}" placeholder="${inh !== null ? esc(toDisp(kind, inh)) : ''}">`;
  };
  const inhText = (key, kind, level = null) => {
    if (isBase) return '';
    const inh = inherited(key, level);
    const src = scope && eff ? 'subject / school default' : 'school default';
    return inh === null ? `<span class="inh">No ${src}</span>` : `<span class="inh">Empty = ${src}: ${esc(kind === 'bool' ? (inh ? 'Yes' : 'No') : toDisp(kind, inh) + unit(kind))}</span>`;
  };
  const activeLevels = S.levels.filter(l => l.is_active);

  el.innerHTML = `<div class="ctx">
      <label>Apply to<select id="rScope">${scopes.map(o => `<option value="${o.value}" ${o.value === (ruleScope.subject || '') ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select></label>
      <label>Starting from<select id="rEff"><option value="">The start (always)</option>${allTerms.map(t => `<option value="${t.id}" ${t.id === eff ? 'selected' : ''}>${esc(nameOf(S.years, t.academic_year_id))} – ${esc(t.name)}</option>`).join('')}</select></label>
      <div style="margin-left:auto" class="tools">${scope && !eff ? '<button class="btn ghost" id="rReset">Reset this subject to school defaults</button>' : ''}<button class="btn primary" id="rSave">Save changes</button></div></div>
    <div class="note">${isBase ? 'These are the school-wide defaults. A subject can override any of them.' : 'Leave a box empty to use the default shown under it.'}
      New numbers are used the next time someone presses <b>Calculate</b> on the Placement page. Earlier results stay as they were if they are locked.</div>
    <div class="panel"><h2>Move lines for each level</h2><p class="help" style="margin-top:6px">Each level has its own lines because each level takes papers of its own difficulty. Leave a box empty if it does not apply (for example, no move-up line for the top level).</p>
      <div class="tbl-wrap levels-grid"><table><thead><tr><th>Level</th>${LEVEL_KEYS.map(k => `<th>${esc(k[1])}</th>`).join('')}</tr></thead>
      <tbody>${activeLevels.map(l => `<tr><td><b>${esc(l.name)}</b></td>${LEVEL_KEYS.map(k => `<td>${inputFor(k[0], 'num', l.id)}<br>${inhText(k[0], 'num', l.id)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>
    ${RULE_GROUPS.map(g => `<div class="panel"><h2>${esc(g.title)}</h2>${g.help ? `<p class="help" style="margin-top:6px">${esc(g.help)}</p>` : '<div style="height:10px"></div>'}
      ${g.items.map(([key, lab, kind]) => `<div class="rules-grid"><span>${esc(lab)}</span><span>${inputFor(key, kind)} ${unit(kind)}</span>${inhText(key, kind)}</div>`).join('')}</div>`).join('')}`;

  $('#rScope').onchange = e => { ruleScope.subject = e.target.value; tabRules(el); };
  $('#rEff').onchange = e => { ruleScope.eff = e.target.value; tabRules(el); };
  const reset = $('#rReset');
  if (reset) reset.onclick = () => confirmBox(`Reset ${nameOf(S.subjects, scope)} to school defaults?`, 'All rules set only for this subject (from the start) will be removed.', async () => {
    const ids = all.filter(r => r.subject_id === scope && !r.effective_from_term && !r.key.startsWith('labels.')).map(r => r.id);
    if (ids.length) await run(sb.from('settings').delete().in('id', ids));
    toast('Reset to school defaults'); tabRules(el);
  }, 'Reset');

  $('#rSave').onclick = async () => {
    const inputs = [...el.querySelectorAll('[data-key]')];
    const parse = (kind, s) => kind === 'pct' ? Number(s) / 100 : kind === 'bool' ? s === 'true' : kind === 'int' ? Number(s) : Number(s);
    const effVal = (key, level = null) => {
      const inp = inputs.find(i => i.dataset.key === key && (i.dataset.level || null) === level);
      if (inp && inp.value.trim() !== '') return parse(inp.dataset.kind, inp.value.trim());
      const inh = inherited(key, level);
      return inh === null ? (own(key, level)?.value ?? null) : inh;
    };
    // checks
    for (const g of RULE_GROUPS.filter(g => g.sum)) {
      const a = effVal(g.sum[0]), b = effVal(g.sum[1]);
      if (a !== null && b !== null && Math.abs(Number(a) + Number(b) - 1) > 0.0001) { toast(`${g.title}: the two weights must add up to 100%`, 'error'); return; }
    }
    for (const l of activeLevels) {
      const up = effVal('placement.move_up', l.id), down = effVal('placement.move_down', l.id), apc = effVal('placement.ap_candidate', l.id);
      if (up !== null && down !== null && Number(down) >= Number(up)) { toast(`${l.name}: the move-down line must be below the move-up line`, 'error'); return; }
      if (up !== null && apc !== null && Number(apc) < Number(up)) { toast(`${l.name}: the AP Candidate line must be at or above the move-up line`, 'error'); return; }
    }
    const ops = [];
    for (const inp of inputs) {
      const key = inp.dataset.key, kind = inp.dataset.kind, level = inp.dataset.level || null;
      const str = inp.value.trim();
      const r = own(key, level);
      if (str === '') { if (r && !isBase) ops.push({ del: r.id }); continue; }
      const v = parse(kind, str);
      if (kind !== 'bool' && !Number.isFinite(v)) { toast(`Check the number for: ${key}`, 'error'); inp.focus(); return; }
      if (kind === 'int' && !Number.isInteger(v)) { toast('Use a whole number', 'error'); inp.focus(); return; }
      if (r) { if (JSON.stringify(r.value) !== JSON.stringify(v)) ops.push({ upd: r.id, value: v }); }
      else ops.push({ ins: { school_id: S.school.id, subject_id: scope, level_id: level, key, value: v, effective_from_term: eff, changed_by: S.user.id } });
    }
    if (!ops.length) { toast('No changes to save'); return; }
    $('#rSave').disabled = true;
    try {
      for (const op of ops) {
        if (op.del) await run(sb.from('settings').delete().eq('id', op.del));
        else if (op.upd) await run(sb.from('settings').update({ value: op.value, changed_by: S.user.id, changed_at: new Date().toISOString() }).eq('id', op.upd));
        else await run(sb.from('settings').insert(op.ins));
      }
      toast(`Saved ${ops.length} change${ops.length === 1 ? '' : 's'}`);
      tabRules(el);
    } finally { const b = $('#rSave'); if (b) b.disabled = false; }
  };
}

// ---- Labels ----
const LABEL_GROUPS = [
  ['rubric', 'Skill rubric levels', { 1: 'Rating 1', 2: 'Rating 2', 3: 'Rating 3', 4: 'Rating 4' }],
  ['statuses', 'Placement statuses', { incomplete: 'No scores yet', on_track: 'Between the lines', ready_up: 'At or above the move-up line', ap_candidate: 'At or above the AP Candidate line', at_risk: 'Below the move-down line', check_not_met: 'Score is high but a check failed' }],
  ['actions', 'Suggestions', { move_up: 'Two quarters above the line', move_down: 'Two quarters below the line', ap_challenge: 'Strong Regular student: take the AP paper', challenge_result: 'Result of the AP challenge paper' }],
  ['decisions', 'Decision options', { approve: 'Accept the suggestion', hold: 'Keep the current level', override: 'Choose a different level' }]
];
async function tabLabels(el) {
  const rows = await run(sb.from('settings').select('*').like('key', 'labels.%').is('subject_id', null).is('level_id', null).is('effective_from_term', null));
  const row = g => rows.find(r => r.key === 'labels.' + g);
  el.innerHTML = `<p class="help">Change the words people see. The meaning of each item stays the same. Level names are changed in the Levels tab.</p>
    ${LABEL_GROUPS.map(([g, title, meaning]) => `<div class="panel"><h2>${esc(title)}</h2><div style="height:10px"></div>
      ${Object.keys(meaning).map(code => `<div class="rules-grid"><span class="inh">${esc(meaning[code])}</span><input data-g="${g}" data-code="${code}" value="${esc((row(g)?.value || {})[code] ?? '')}" aria-label="${esc(meaning[code])}"><span></span></div>`).join('')}</div>`).join('')}
    <button class="btn primary" id="lSave">Save labels</button>`;
  $('#lSave').onclick = async () => {
    for (const [g] of LABEL_GROUPS) {
      const val = {};
      el.querySelectorAll(`[data-g="${g}"]`).forEach(i => { if (i.value.trim()) val[i.dataset.code] = i.value.trim(); });
      const r = row(g);
      if (r) { if (JSON.stringify(r.value) !== JSON.stringify(val)) await run(sb.from('settings').update({ value: val, changed_by: S.user.id, changed_at: new Date().toISOString() }).eq('id', r.id)); }
      else await run(sb.from('settings').insert({ school_id: S.school.id, key: 'labels.' + g, value: val, changed_by: S.user.id }));
    }
    await loadLookups(); toast('Labels saved'); tabLabels(el);
  };
}

// ---- Change history ----
async function tabHistory(el) {
  const rows = await run(sb.from('audit_log').select('*').eq('table_name', 'settings').order('changed_at', { ascending: false }).limit(200));
  const v = r => r.new_value || r.old_value || {};
  const show = x => x === null || x === undefined ? '' : typeof x === 'object' ? JSON.stringify(x) : String(x);
  el.innerHTML = `<div class="sec-head"><h2>Settings changes</h2>${exportButtons('expH')}</div>` + tableHTML([
    { label: 'When', val: r => new Date(r.changed_at).toLocaleString() },
    { label: 'Who', val: r => staffName(r.user_id) || 'Setup (SQL)' },
    { label: 'Setting', val: r => v(r).key },
    { label: 'Applies to', val: r => [v(r).subject_id ? nameOf(S.subjects, v(r).subject_id) : 'Whole school', v(r).level_id ? nameOf(S.levels, v(r).level_id) : '', v(r).effective_from_term ? 'from ' + nameOf(S.terms, v(r).effective_from_term) : ''].filter(Boolean).join(', ') },
    { label: 'Before', val: r => r.action === 'INSERT' ? '(new)' : show(r.old_value?.value) },
    { label: 'After', val: r => r.action === 'DELETE' ? '(removed)' : show(r.new_value?.value) }
  ], rows, { empty: 'No settings changes recorded yet.' });
  bindExport(el, 'expH', 'Settings history', () => ({ title: 'Settings change history', head: ['When', 'Who', 'Setting', 'Before', 'After'],
    body: rows.map(r => [new Date(r.changed_at).toLocaleString(), staffName(r.user_id), v(r).key, r.action === 'INSERT' ? '(new)' : show(r.old_value?.value), r.action === 'DELETE' ? '(removed)' : show(r.new_value?.value)]) }));
}

start();
</script>
</body>
</html>
