.next{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

<script>
(function(){
'use strict';
const CFG=window.SITE_CONFIG||{};
const HAS_DB=!!(window.supabase&&CFG.SUPABASE_URL&&!CFG.SUPABASE_URL.includes('YOUR-PROJECT'));
const sb=HAS_DB?window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY):null;
const main=document.getElementById('main');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.k);toast.k=setTimeout(()=>el.hidden=true,2600)}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const on=(id,ev,fn)=>{const e=$(id);if(e)e.addEventListener(ev,fn)};

/* ---------- teaching building blocks ---------- */
const H=(n,title,sub)=>`<div class="sechead"><span class="secnum">${n}</span><div><h2>${title}</h2>${sub?`<p class="muted">${sub}</p>`:''}</div></div>`;
const DEF=(term,text)=>`<div class="defn"><p class="term">Definition · ${term}</p><p>${text}</p></div>`;
const NOTE=t=>`<p class="note">${t}</p>`;
const EX=items=>`<div class="exgrid">${items.map(([t,d])=>`<div class="ex"><b>${t}</b><span>${d}</span></div>`).join('')}</div>`;
const FLOW=(steps,cls)=>`<div class="flow ${cls||''}">${steps.map(([t,d,c],i)=>`${i?'<span class="farrow" aria-hidden="true">→</span>':''}<div class="fstep ${c||''}" style="animation-delay:${i*140}ms"><b>${t}</b>${d?`<span>${d}</span>`:''}</div>`).join('')}</div>`;
const TABLE=(head,rows)=>`<div class="tablebox"><table><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td class="tw">${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
const KEY=items=>`<ul class="keys">${items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
let PRINT=false, PRINTACT={};
const TRY=(label,title,inner)=>PRINT?`<section class="station try"><p class="num">Class activity · ${label}</p><h3>${title}</h3>${PRINTACT[title]?PRINTACT[title]():'<p class="muted">Interactive activity on the website.</p>'}</section>`:`<section class="station try"><p class="num">Try it · ${label}</p><h3>${title}</h3>${inner}</section>`;

const KEYBOX=items=>`<section class="station keybox"><p class="num">Remember</p>${KEY(items)}</section>`;

/* ---------- lessons and quizzes ---------- */
const LESSONS=[
 {id:'l1',name:'Artificial Intelligence',short:'AI',blurb:'What AI is, how machines learn, and how an AI app like ChatGPT is built.'},
 {id:'l2',name:'Cybersecurity',short:'Cyber',blurb:'Threats, malware, scams, passwords and encryption, with Indian examples.'},
 {id:'l3',name:'Databases & SQL',short:'SQL',blurb:'How apps store data, tables and keys, and real SQL on a chemist shop’s data.'},
 {id:'l4',name:'Python basics',short:'Python',blurb:'Programs, data types, decisions and loops, watched line by line.'}
];
const Qz=(q,o,a,why)=>({q,o,a,why});
const QUIZ={
 l1:{title:'Artificial Intelligence',
  q1:[
   Qz('Artificial Intelligence is best described as…',['A robot body made of metal','Computer systems that do tasks which normally need human intelligence','A very fast internet connection','A new type of keyboard'],1,'AI means machines that learn, reason, understand language or make decisions.'),
   Qz('Who first used the term “Artificial Intelligence”, in 1956?',['Bill Gates','John McCarthy','Elon Musk','Steve Jobs'],1,'John McCarthy named the field at the Dartmouth conference in 1956.'),
   Qz('Which everyday app uses AI to predict traffic and arrival time?',['Calculator','Google Maps','Torch','Clock'],1,'Google Maps learns from live and past travel data to predict traffic.'),
   Qz('All the AI we use today (ChatGPT, face unlock, Maps) is…',['General AI','Super AI','Narrow AI','Human AI'],2,'Narrow AI is very good at one kind of task. General AI does not exist yet.'),
   Qz('Machine Learning is…',['A part of AI where computers learn from data','Bigger than AI','A computer chip','A programming language'],0,'Machine Learning sits inside AI: the computer learns patterns from examples.'),
   Qz('In machine learning, what do we give the computer?',['Only the rules','Data with answers, so it can find the rules','Only a password','Nothing'],1,'Normal programs get rules from us; ML finds the rules from data and answers.'),
   Qz('Face unlock on a phone uses…',['Deep Learning','A spreadsheet','A calculator','Bluetooth'],0,'Face recognition uses many-layer neural networks: Deep Learning.'),
   Qz('Which order shows how an AI system works?',['Data → Training → Model → Prediction','Prediction → Data → Model → Training','Model → Typing → Printing → Data','Internet → Charging → Output → Data'],0,'We collect data, train on it, get a model, then use the model to predict.'),
   Qz('YouTube suggesting your next video is an example of…',['AI predicting what you may like','A computer virus','A broken database','Staff choosing videos by hand'],0,'A recommendation system learns from what you and similar viewers watched.'),

function neuralSVG(){
  const layers=[3,4,4,2], X=[70,210,350,490], H=260;
  const pos=layers.map((n,li)=>Array.from({length:n},(_,i)=>[X[li],(H/(n+1))*(i+1)+10]));
  let lines='';
  for(let l=0;l<layers.length-1;l++)pos[l].forEach(a=>pos[l+1].forEach(b=>{lines+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" class="nnline" style="animation-delay:${l*0.5}s"/>`}));
  const cols=['var(--teal)','var(--accent)','var(--accent)','var(--good)'];
  const nodes=pos.map((ps,l)=>ps.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="17" fill="${cols[l]}" class="nnnode" style="animation-delay:${l*0.5}s"/>`).join('')).join('');
  const lab=['Input layer','Hidden layer 1','Hidden layer 2','Output layer'].map((t,i)=>`<text x="${X[i]}" y="${H+40}" font-size="14" font-weight="700" text-anchor="middle" fill="var(--soft)">${t}</text>`).join('');
  const inl=['Pixels','Shape','Colour'].map((t,i)=>`<text x="${X[0]-28}" y="${pos[0][i][1]+5}" font-size="13" text-anchor="end" fill="var(--soft)">${t}</text>`).join('');
  const outl=['Cat 92%','Dog 8%'].map((t,i)=>`<text x="${X[3]+28}" y="${pos[3][i][1]+5}" font-size="13" font-weight="700" fill="var(--ink)">${t}</text>`).join('');
  return `<svg viewBox="-30 0 620 ${H+56}" role="img" aria-label="Neural network diagram: input layer, two hidden layers and an output layer, with every node connected to the next layer" style="width:100%">${lines}${nodes}${lab}${inl}${outl}</svg>`;
}

  const h=+$('hrs').value,a=+$('att').value; $('hv').textContent=h; $('av').textContent=a;
  const X=v=>50+v/8*440, Y=v=>260-(v-40)/60*230, dist=t=>Math.hypot((t.h-h)/8,(t.a-a)/60);
  const near=TRAIN.reduce((b,t)=>dist(t)<dist(b)?t:b,TRAIN[0]);
  let s=`<line x1="50" y1="260" x2="490" y2="260" stroke="var(--line)"/><line x1="50" y1="30" x2="50" y2="260" stroke="var(--line)"/>`;
  for(let v=0;v<=8;v+=2)s+=`<text x="${X(v)}" y="282" font-size="13" text-anchor="middle" fill="var(--soft)">${v}h</text>`;
  for(let v=40;v<=100;v+=20)s+=`<text x="42" y="${Y(v)+4}" font-size="13" text-anchor="end" fill="var(--soft)">${v}%</text>`;
  s+=`<line x1="${X(h)}" y1="${Y(a)}" x2="${X(near.h)}" y2="${Y(near.a)}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 5"/>`;
  TRAIN.forEach(t=>{const c=t.r==='Pass'?'var(--good)':'var(--bad)';s+=`<circle cx="${X(t.h)}" cy="${Y(t.a)}" r="11" fill="${c}"/><text x="${X(t.h)+16}" y="${Y(t.a)+5}" font-size="13" fill="var(--soft)">${t.r}</text>`});
  s+=`<circle cx="${X(h)}" cy="${Y(a)}" r="13" fill="var(--accent)" stroke="var(--surface)" stroke-width="3"/><text x="${X(h)}" y="${Y(a)-20}" font-size="13" font-weight="700" text-anchor="middle" fill="var(--accent)">New</text>`;
  $('plot').innerHTML=s;
  const fb=$('predfb');fb.className='feedback '+(near.r==='Pass'?'good':'bad');
  fb.textContent=`Prediction: ${near.r}. The most similar student studied ${near.h} h with ${near.a}% attendance.`;
}
async function runNext(){
  const btn=$('runnext');btn.disabled=true;
  const words='The capital of India is', el=$('typed'); el.innerHTML='';
  for(let i=1;i<=words.length;i++){el.innerHTML=esc(words.slice(0,i))+'<span class="caret"></span>';await sleep(45)}
  const cand=[['Delhi',92],['Mumbai',4],['Kolkata',2],['big',1],['in',1]];
  $('nextbars').innerHTML=cand.map(([w,p],i)=>`<div class="bar"><b>${w}</b><div class="track"><div class="fillbar${i===0?' win':''}" id="nb${i}"></div></div><span>${p}%</span></div>`).join('');
  await sleep(60); cand.forEach(([w,p],i)=>{$('nb'+i).style.width=p+'%'});
  await sleep(900); el.innerHTML=esc(words)+' <span style="color:var(--accent)">Delhi</span>';
  btn.disabled=false; btn.textContent='Run again';
}
function updPrompt(){

function initL1(){

function crack(pw){
  if(!pw)return null; let cs=0;
  if(/[a-z]/.test(pw))cs+=26; if(/[A-Z]/.test(pw))cs+=26; if(/[0-9]/.test(pw))cs+=10; if(/[^a-zA-Z0-9]/.test(pw))cs+=33;
  const log10=pw.length*Math.log10(cs); return {secs:Math.pow(10,log10-10)/2,cs,len:pw.length,log10};
}
function human(s){
  if(s<1)return 'Instantly'; if(s<60)return Math.round(s)+' seconds'; if(s<3600)return Math.round(s/60)+' minutes'; if(s<86400)return Math.round(s/3600)+' hours';
  if(s<31557600)return Math.round(s/86400)+' days'; const y=s/31557600;
  if(y<1e3)return Math.round(y)+' years'; if(y<1e6)return Math.round(y/1e3)+' thousand years'; if(y<1e9)return (y/1e6).toFixed(1)+' million years'; return 'Billions of years';
}

function sqRun(){
  const u=$('sq-u').value, p=$('sq-p').value, vuln=SQMODE==='vuln';
  const q=vuln?`SELECT * FROM users WHERE username = '${u}' AND password = '${p}';`:`SELECT * FROM users WHERE username = ? AND password = ?;   -- values sent separately: ['${u}', '${p}']`;
  $('sq-q').textContent=q;
  let row=null, err=null;
  if(SQLDB){
    try{
      SQLDB.run(`DROP TABLE IF EXISTS users; CREATE TABLE users(username TEXT, password TEXT); INSERT INTO users VALUES ('admin','Adm!n#2026'),('riya','riya@123');`);
      if(vuln){const r=SQLDB.exec(q);row=r.length&&r[r.length-1].values.length?r[r.length-1].values[0]:null}
      else{const st=SQLDB.prepare('SELECT * FROM users WHERE username = ? AND password = ?');st.bind([u,p]);if(st.step())row=st.get();st.free()}
    }catch(e){err=e.message}
  }else{
    const exact=USERS.find(x=>x[0]===u&&x[1]===p);
    if(!vuln)row=exact||null;
    else if(exact)row=exact;
    else if(/'\s*or\s*'?(\w+)'?\s*=\s*'?\1/i.test(u+' '+p))row=USERS[0];

  }
  const fb=$('sq-out');
  if(err){fb.className='feedback bad';fb.textContent='SQL error: '+err+'. Errors like this tell an attacker the input reaches the database.';return}
  if(!row){fb.className='feedback info';fb.textContent=vuln?'Login failed.':'Login failed. With a parameterised query the input is treated as data, never as SQL code, so the attack cannot work.';return}
  const legit=USERS.some(x=>x[0]===u&&x[1]===p);
  fb.className='feedback '+(legit?'good':'bad');
  fb.textContent=legit?`Logged in as ${row[0]} (correct username and password).`:`HACKED: logged in as ${row[0]} without knowing the password! The input changed the meaning of the SQL query.`;

const MEDS=[[1,'Paracetamol 650','B101','2027-08-31',120,2.10],[2,'Amoxicillin 500','A220','2026-12-31',15,8.50],[3,'Cetirizine 10','C330','2027-03-31',60,1.80],[4,'Pantoprazole 40','P440','2027-01-15',8,6.00],[5,'ORS sachet','O550','2028-02-28',200,21.00]];
const SALES=[[101,1,'2026-11-10',10],[102,2,'2026-11-10',3],[103,1,'2026-11-11',6],[104,5,'2026-11-12',20],[105,4,'2026-11-12',2]];
const PRESETS=[
 ['See everything','SELECT * FROM medicines;'],
 ['Low stock','SELECT name, qty FROM medicines WHERE qty < 20;'],
 ['Expiring soon',"SELECT name, expiry FROM medicines\nWHERE expiry < '2027-03-31'\nORDER BY expiry;"],
 ['Price above ₹5','SELECT name, price FROM medicines WHERE price > 5;'],

 ['Sold per medicine (JOIN + GROUP BY)','SELECT m.name, SUM(s.qty) AS sold\nFROM sales s JOIN medicines m ON s.med_id = m.med_id\nGROUP BY m.name;']
];
function presetResult(sql){
  const n=sql.replace(/\s+/g,' ').trim().toLowerCase(), P=PRESETS.map(p=>p[1].replace(/\s+/g,' ').trim().toLowerCase()), i=P.indexOf(n);
  const cols=['med_id','name','batch','expiry','qty','price'];
  switch(i){
    case 0:return{columns:cols,values:MEDS};
    case 1:return{columns:['name','qty'],values:MEDS.filter(m=>m[4]<20).map(m=>[m[1],m[4]])};
    case 2:return{columns:['name','expiry'],values:MEDS.filter(m=>m[3]<'2027-03-31').sort((a,b)=>a[3].localeCompare(b[3])).map(m=>[m[1],m[3]])};
    case 3:return{columns:['name','price'],values:MEDS.filter(m=>m[5]>5).map(m=>[m[1],m[5]])};
    case 4:return{columns:['name','price'],values:[...MEDS].sort((a,b)=>b[5]-a[5]).map(m=>[m[1],m[5]])};
    case 5:return{columns:['COUNT(*)'],values:[[MEDS.length]]};
    case 6:return{columns:['stock_value'],values:[[MEDS.reduce((s,m)=>s+m[4]*m[5],0)]]};
    case 7:return{columns:['avg_price'],values:[[MEDS.reduce((s,m)=>s+m[5],0)/MEDS.length]]};
    case 8:return{columns:['MIN(price)','MAX(price)'],values:[[Math.min(...MEDS.map(m=>m[5])),Math.max(...MEDS.map(m=>m[5]))]]};
    case 9:{const t={};SALES.forEach(s=>{const nm=MEDS.find(m=>m[0]===s[1])[1];t[nm]=(t[nm]||0)+s[3]});return{columns:['name','sold'],values:Object.keys(t).sort().map(k=>[k,t[k]])}}
  }
  return null;
}
let SQLDB=null, sqlState='loading';
async function loadSQL(){
  if(!SQLDB&&sqlState!=='failed'){
    try{
      if(!window.initSqlJs)throw new Error('no lib');
      const SQL=await window.initSqlJs({locateFile:f=>'https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/'+f});
      SQLDB=new SQL.Database();
      SQLDB.run(`CREATE TABLE medicines(med_id INT PRIMARY KEY, name TEXT NOT NULL, batch TEXT, expiry TEXT, qty INT CHECK(qty>=0), price REAL);
        CREATE TABLE sales(sale_id INT PRIMARY KEY, med_id INT REFERENCES medicines(med_id), sale_date TEXT, qty INT);`);
      const st=SQLDB.prepare('INSERT INTO medicines VALUES (?,?,?,?,?,?)');MEDS.forEach(r=>st.run(r));st.free();
      const s2=SQLDB.prepare('INSERT INTO sales VALUES (?,?,?,?)');SALES.forEach(r=>s2.run(r));s2.free();
      sqlState='ready';
    }catch(e){sqlState='failed'}
  }
  const el=$('sqlstate'); if(el)el.innerHTML=sqlState==='ready'?'<span class="tag good">Live SQL engine ready: type any SELECT query</span>':'<span class="tag warn">Offline mode: the example buttons still work</span>';
}
function tableHtml(res){
  if(!res||!res.columns)return '<p class="muted">The query ran. It returned no rows.</p>';
  const fmt=v=>typeof v==='number'&&!Number.isInteger(v)?v.toFixed(2):v;
  return `<div class="tablebox"><table><tr>${res.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${res.values.map((r,i)=>`<tr class="new" style="animation-delay:${i*90}ms">${r.map(v=>`<td>${esc(fmt(v))}</td>`).join('')}</tr>`).join('')}</table></div><p class="small muted">${res.values.length} row${res.values.length===1?'':'s'}</p>`;
}
function runSQL(){
  const sql=$('sqlin').value.trim(), out=$('sqlout');
  if(!sql){out.innerHTML='<p class="feedback bad">Type a query first.</p>';return}
  if(SQLDB){
    if(/\b(drop|delete|update|insert|alter|create)\b/i.test(sql)){out.innerHTML='<p class="feedback info">In this practice table only SELECT queries are allowed, so everyone sees the same data.</p>';return}
    try{const r=SQLDB.exec(sql); out.innerHTML=tableHtml(r[r.length-1])}catch(e){out.innerHTML=`<p class="feedback bad">SQL error: ${esc(e.message)}. Check spelling, commas and the semicolon.</p>`}
  }else{const r=presetResult(sql); out.innerHTML=r?tableHtml(r):'<p class="feedback info">Offline mode can only run the example buttons. Connect to the internet to type your own query.</p>'}
}

function pyType(v){
  v=v.trim(); if(!v)return null;
  if(/^(["']).*\1$/.test(v))return ['str','Anything inside quotes is text (str).'];
  if(/^-?\d+$/.test(v))return ['int','A whole number is an int.'];
  if(/^-?(\d+\.\d*|\.\d+)$/.test(v))return ['float','A number with a decimal point is a float.'];
  if(v==='True'||v==='False')return ['bool','True and False (capital letter, no quotes) are bool.'];
  if(v==='true'||v==='false')return [null,'Python is case-sensitive: write True or False with a capital letter.'];
  return [null,'In Python, text needs quotes, like "'+v+'".'];
}
async function traceGrade(){
  const btn=$('grun'), m=Number($('gm').value); if(!Number.isFinite(m)){toast('Enter a number');return}
  btn.disabled=true; const L=[...document.querySelectorAll('#gcode .l')];
  L.forEach(l=>{l.className='l';const k=l.querySelector('.mark');if(k)k.remove()}); $('gout').textContent='';
  const mark=(i,t,ok)=>{const s=document.createElement('span');s.className='mark';s.style.color=ok?'#8FE0A8':'#F38A7E';s.textContent=t;L[i].appendChild(s)};
  const hit=async i=>{L[i].classList.add('hit');await sleep(650)};
  await hit(0); mark(0,'marks = '+m,true); L[0].classList.remove('hit');
  let printed=null;
  for(const [ci,ok,pi,txt] of [[1,m>=75,2,'Grade A'],[3,m>=60,4,'Grade B'],[5,m>=33,6,'Grade C - Pass']]){
    await hit(ci); mark(ci,ok?'True':'False',ok);
    if(ok){L[ci].classList.remove('hit');await hit(pi);printed=txt;break}
    L[ci].classList.remove('hit'); L[pi].classList.add('skip');
  }
  if(!printed){await hit(7);L[7].classList.remove('hit');await hit(8);printed='Fail'}
  for(let i=1;i<L.length;i++)if(!L[i].classList.contains('hit')&&!L[i].querySelector('.mark'))L[i].classList.add('skip');
  $('gout').textContent=printed; btn.disabled=false; btn.textContent='Run again';
}
function updBill(){
  const p=Number($('bp').value)||0,q=Math.floor(Number($('bq').value)||0); let bill=p*q; const disc=bill>500;
  const L=[...document.querySelectorAll('#bcode .l')]; L.forEach(l=>{l.className='l';const k=l.querySelector('.mark');if(k)k.remove()});
  const mark=(i,t,c)=>{const s=document.createElement('span');s.className='mark';s.style.color=c||'#F4B183';s.textContent=t;L[i].appendChild(s)};
  mark(0,'price = '+p); mark(1,'qty = '+q); mark(2,'bill = '+(+(p*q).toFixed(2))); mark(3,disc?'True':'False',disc?'#8FE0A8':'#F38A7E');
  if(disc){bill=bill-bill*0.10;L[4].classList.add('hit');mark(4,'bill = '+(+bill.toFixed(2)))}else L[4].classList.add('skip');
  $('bout').textContent='Amount to pay: '+(Number.isInteger(bill)?bill.toFixed(1):String(+bill.toFixed(2)))+(disc?'   (10% discount applied)':'   (no discount)');
}
function updLoop(){const n=Number($('ln').value);if(!Number.isFinite(n)){$('lout').textContent='';return}$('lout').textContent=Array.from({length:10},(_,i)=>`${n} x ${i+1} = ${n*(i+1)}`).join('\n')}
function initL4(){
  on('tv','input',e=>{const r=pyType(e.target.value);$('tout').textContent=r?(r[0]?`type(${e.target.value.trim()}) → <class '${r[0]}'>\n${r[1]}`:r[1]):"type( … ) will show here"});

  on('tr-text','click',()=>setTrap(false)); on('tr-num','click',()=>setTrap(true));
  on('grun','click',traceGrade);
  if($('bp')){['bp','bq'].forEach(id=>$(id).addEventListener('input',updBill));updBill()}
  if($('ln')){$('ln').addEventListener('input',updLoop);updLoop()}
}

function initL5(){
  const done={};
  document.querySelectorAll('[data-dm]').forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.dm,d=DEALS[i],ok=b.dataset.v===d[1];
    if(!(i in done)){done[i]=ok;$('dmscore').textContent=Object.values(done).filter(Boolean).length}
    const fb=$('dm'+i).querySelector('.feedback');fb.hidden=false;fb.className='feedback '+(ok?'good':'bad');
    fb.textContent=(ok?'Correct. ':'Not quite. The answer is ')+d[1]+' ('+MODELS[d[1]]+'): '+d[2];
    $('dm'+i).querySelectorAll('button').forEach(x=>x.disabled=true);
  }));
  if($('ordbtns')){
    let picked=[];
    const shuffled=[3,0,6,1,7,4,2,5];
    const draw=()=>{
      $('ordbtns').innerHTML=shuffled.filter(i=>!picked.includes(i)).map(i=>`<button class="btn" data-ord="${i}" style="min-height:38px;padding:6px 12px;text-align:left">${esc(ORDER[i])}</button>`).join('');
      $('ordlist').innerHTML=picked.map(i=>`<li>${esc(ORDER[i])}</li>`).join('');
      document.querySelectorAll('[data-ord]').forEach(b=>b.addEventListener('click',()=>{
        const i=+b.dataset.ord, fb=$('ordfb');
        if(i===picked.length){picked.push(i);fb.className='feedback good';fb.textContent=picked.length===ORDER.length?'Perfect! That is the full journey of an online order.':'Correct. Next step?'}
        else{fb.className='feedback bad';fb.textContent='Not yet. Think: what must happen before “'+ORDER[i]+'”?'}
        draw();
      }));
    };
    on('ordreset','click',()=>{picked=[];$('ordfb').className='feedback info';$('ordfb').textContent='Tap the first step.';draw()});
    draw();
  }
  if($('sr-t')){
    const sr=()=>{const t=$('sr-t').value,d=$('sr-d').value;

        ['Clicks','Budget ÷ CPC',Math.round(clicks).toLocaleString('en-IN')],

        ['CPM','Budget ÷ impressions × 1,000',inr(cpm)],
        ['Orders','Clicks × conversion rate',Math.round(orders).toLocaleString('en-IN')],
        ['Revenue','Orders × order value',inr(rev)],
        ['CPA','Budget ÷ orders',inr(cpa)],
        ['ROAS','Revenue ÷ budget',roas.toFixed(1)+'×']].map(r=>`<tr>${r.map(c=>`<td class="tw">${c}</td>`).join('')}</tr>`).join('');
      const fb=$('ac-fb');fb.className='feedback '+(roas>=4?'good':roas>=2?'info':'bad');
      fb.textContent=roas>=4?`Excellent: every ₹1 of ads brings back ₹${roas.toFixed(1)} in sales.`:roas>=2?`Profitable if the profit margin is good: ₹${roas.toFixed(1)} of sales per ₹1 of ads.`:`Losing money: only ₹${roas.toFixed(1)} of sales per ₹1 of ads. Lower the cost per click (better-quality ads usually cost less per click) or improve the website so more visitors buy (higher conversion rate).`;};
    ['ac-b','ac-c','ac-t','ac-r','ac-o'].forEach(id=>on(id,'input',ac));ac();
  }
}

      <div class="row" style="justify-content:center;gap:28px"><div><p class="small" style="opacity:.8">Quiz 1</p><p class="big">${pre}<span style="font-size:.5em">/${Q.q1.length}</span></p></div><div><p class="small" style="opacity:.8">Final quiz</p><p class="big">${post}<span style="font-size:.5em">/${Q.q2.length}</span></p></div></div>
      <p>${pre+post>=16?'Outstanding work today!':pre+post>=10?'Well done!':'Good effort. Read the answers and revise the lesson.'}</p><p class="small" style="opacity:.8">${esc(ME.note||'')}</p></div>
    <section class="station"><h2>Final quiz answers</h2>${review(Q.q2,ME.postAns)}</section>
    <div class="row"><a class="btn" href="#${L}">Read the full lesson again</a><a class="btn" href="#home">All lessons</a></div>`;
  }else{
    body=`<h1>This class has ended</h1><p class="lead">Thank you for joining. You can still read and practise any lesson.</p><a class="btn primary" href="#home">Explore all lessons</a>`;
  }
  main.innerHTML=head+body; if(init)init(); bindClass(step); window.scrollTo(0,0);
}
function bindClass(step){
  on('joinform','submit',e=>{e.preventDefault();const name=$('jn').value.trim();if(!name){toast('Please type your name');return}
    ME={key:newKey(),name,roll:$('jr').value.trim(),course:$('jc').value,year:+$('jy').value,preScore:null,postScore:null};
    try{localStorage.setItem('student',JSON.stringify({name,roll:ME.roll,course:ME.course,year:ME.year}))}catch(err){}
    saveMe(); renderClass(true)});
  on('pnext','click',()=>{CLS.stage=step==='intro'?'pre':step==='wait-pre'?'lesson':'post';ME.pstage=CLS.stage;saveMe();renderClass(true)});
  const f=$('cquiz'); if(!f)return;
  const qs=f.dataset.phase==='pre'?QUIZ[CLS.lesson].q1:QUIZ[CLS.lesson].q2;
  f.addEventListener('change',()=>{$('qprog').textContent=`${qs.filter((_,i)=>document.querySelector(`input[name="c${i}"]:checked`)).length} of ${qs.length} answered`});
  f.addEventListener('submit',async e=>{
    e.preventDefault(); const phase=f.dataset.phase;
    const ans=qs.map((_,i)=>{const r=document.querySelector(`input[name="c${i}"]:checked`);return r?+r.value:-1});
    if(ans.includes(-1)){toast('Answer every question first');return}
    const score=ans.reduce((s,a,i)=>s+(a===qs[i].a?1:0),0);
    $('csub').disabled=true; let note='';
    if(sb){
      const rec={session_id:CLS.practice?null:CLS.id,student_key:ME.key,phase:CLS.practice?'practice':phase,student_name:ME.name,roll_no:ME.roll,course:ME.course,year:ME.year,lesson:CLS.lesson,score,total:qs.length,answers:ans};
      const {error}=await sb.from('quiz_results').insert(rec);
      note=(error&&error.code!=='23505')?'Could not send to your teacher. Show this screen to your teacher.':(CLS.practice?'Practice result saved.':'Your results were sent to your teacher.');
      if(error&&error.code!=='23505')toast(note);
    }else note='Practice mode: results are not saved.';
    if(phase==='pre'){ME.preScore=score;ME.preAns=ans}else{ME.postScore=score;ME.postAns=ans;ME.note=note}
    if(CLS.practice)ME.pstage=phase==='pre'?'pre':'post';
    saveMe(); renderClass(true);
  });
}

let REP={sessions:[],results:[],sel:null};
function vReports(){return `<section class="hero"><p class="eyebrow">Reports</p><h1>Learning reports</h1><p class="lead">Quiz 1 (the basics) and the final quiz (the whole lesson), for every class and every student.</p></section><div id="rbody"><p class="muted">Loading…</p></div>`}

async function loadReports(){
  const [s,r]=await Promise.all([sb.from('class_sessions').select('*').order('created_at',{ascending:false}).limit(300),sb.from('quiz_results').select('*').order('created_at',{ascending:true}).limit(10000)]);
  if(s.error||r.error){$('rbody').innerHTML=`<p class="feedback bad">${esc((s.error||r.error).message)}</p>`;return}
  REP.sessions=s.data||[]; REP.results=(r.data||[]).filter(x=>x.session_id);

const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function sessionStats(sid){
  const ses=REP.sessions.find(x=>x.id===sid), Q=QUIZ[ses.lesson], by={};
  REP.results.filter(r=>r.session_id===sid).forEach(r=>{const s=by[r.student_key]=by[r.student_key]||{name:r.student_name,roll:r.roll_no,course:r.course,year:r.year};s[r.phase]=r.score;s[r.phase+'Ans']=r.answers});
  const st=Object.values(by);
  const preAvg=mean(st.filter(s=>s.pre!=null).map(s=>s.pre/Q.q1.length*100)), postAvg=mean(st.filter(s=>s.post!=null).map(s=>s.post/Q.q2.length*100));
  const rate=(qs,key)=>qs.map((q,i)=>{const g=st.filter(s=>Array.isArray(s[key]));return g.length?Math.round(g.filter(s=>s[key][i]===q.a).length/g.length*100):null});
  const strong=st.filter(s=>s.post!=null&&s.post/Q.q2.length>=0.7).length, finished=st.filter(s=>s.post!=null).length;
  return {ses,Q,st,preAvg,postAvg,q1rate:rate(Q.q1,'preAns'),q2rate:rate(Q.q2,'postAns'),strong,finished};
}
const pc=v=>v==null?'–':Math.round(v)+'%';

    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='class-report.csv';a.click();
  });
}

 'The input trap: "5" + "3" or 5 + 3?':()=>BOARD('Ask the class to predict both outputs.')+TABLE(['Code','Output','Why'],[['print("5" + "3")','53','text + text joins'],['print(int("5") + int("3"))','8','int() turns text into numbers']]),
 'Watch if / elif / else run, step by step':()=>BOARD('Write the program. Trace each value of marks with the class, line by line.')+CODE(GRADE)+TABLE(['marks','Conditions checked','Output'],[['82','≥ 75 True','Grade A'],['60','≥ 75 False, ≥ 60 True','Grade B'],['45','≥ 75 False, ≥ 60 False, ≥ 33 True','Grade C - Pass'],['20','all False → else','Fail']]),
 'Multiplication table with a for loop':()=>BOARD('Write the loop. Ask: what prints when n is 7? What changes with range(1, 21)?')+`<p class="out">${Array.from({length:10},(_,i)=>`7 x ${i+1} = ${7*(i+1)}`).join('\n')}</p><p>range(1, 21) prints up to 7 x 20: the end number is not included.</p>`,
 'Real life: chemist bill with discount':()=>BOARD('Give the task first. Pairs write it in notebooks; one pair writes it on the board.')+CODE(BILL)+TABLE(['Price','Strips','Bill','Above 500?','Amount to pay'],[['120','5','600','Yes','540.0'],['50','4','200','No','200.0'],['250','3','750','Yes','675.0']])
};
Object.assign(PRINTACT,{
 'Which e-commerce model is it?':()=>BOARD('Write the eight model names on the board. Read each deal aloud; students call out the model.')+TABLE(['Deal','Model and reason'],DEALS.map(d=>[esc(d[0]),`<b>${d[1]}</b> (${MODELS[d[1]]}): ${d[2]}`])),
 'Put the online order in the right order':()=>BOARD('Write the steps on the board in this jumbled order. Students number them 1 to 8.')+TABLE(['Jumbled step','Correct position'],[3,0,6,1,7,4,2,5].map(i=>[esc(ORDER[i]),String(i+1)])),
 'Write a Google search listing':()=>BOARD('Draw a Google result: a blue title and a grey description. Ask the class to write one for Gupta Sweets, Bijnor, then check it against the four rules.')+TABLE(['Part','Example','Rule'],[['Title','Gupta Sweets Bijnor | Fresh Mithai, Order on WhatsApp','30–60 characters, includes the keyword'],['Description','Fresh kaju katli, rasgulla and Diwali gift boxes made daily in Bijnor. Home delivery and same-day orders on WhatsApp.','70–160 characters, keyword + reason to act']]),
 'Ad campaign calculator':()=>BOARD('Write the numbers below. Let students calculate each result step by step, then change the CTR to 4% and ask what improves.')+TABLE(['Given','Value'],[['Ad budget','₹5,000'],['CPC','₹5'],['CTR','2%'],['Conversion rate','4%'],['Average order value','₹800']])+TABLE(['Result','Working','Answer'],[['Clicks','5,000 ÷ 5','1,000'],['Impressions','1,000 ÷ 2%','50,000'],['CPM','5,000 ÷ 50,000 × 1,000','₹100'],['Orders','1,000 × 4%','40'],['Revenue','40 × ₹800','₹32,000'],['CPA','5,000 ÷ 40','₹125'],['ROAS','32,000 ÷ 5,000','6.4×']])
});
const PLAN={intro:'12 min',pre:'5 min',lesson:'15 min',post:'5 min'};
function printQuiz(qs){return `<ol class="pq">${qs.map(q=>`<li><p><b>${esc(q.q)}</b></p><ol type="a">${q.o.map((o,j)=>`<li${j===q.a?' class="ok"':''}>${esc(o)}${j===q.a?' ✓':''}</li>`).join('')}</ol><p class="small muted">${esc(q.why)}</p></li>`).join('')}</ol>`}
function printQuizStudent(qs){return `<ol class="pq">${qs.map(q=>`<li><p><b>${esc(q.q)}</b></p><ol type="a">${q.o.map(o=>`<li>${esc(o)}</li>`).join('')}</ol></li>`).join('')}</ol>`}
function vPrint(only){
  PRINT=true;
  const list=only?LESSONS.filter(l=>l.id===only):LESSONS;
  let h=`<section class="pcover"><p class="eyebrow">Teacher’s book</p><h1>Learn Computing Today</h1><p class="lead">${list.length>1?list.length+' lessons':'One lesson'} of 40 minutes: theory, diagrams, board activities, and two 10-question quizzes with answer keys.</p>${CFG.TEACHER?`<p><b>${esc(CFG.TEACHER)}</b></p>`:''}
  ${TABLE(['Lesson','Part 1: Basics','Part 2: Deeper'],list.map(l=>[`<b>${l.name}</b>`,INTRO[l.id].goals.slice(0,2).map(esc).join('<br>'),esc(INTRO[l.id].goals[2])]))}</section>`;
  list.forEach((l,i)=>{const Q=QUIZ[l.id], I=INTRO[l.id];
    h+=`<div class="lessonstart"><section class="hero"><p class="eyebrow">Lesson ${LESSONS.indexOf(l)+1}</p><h1>${l.name}</h1></section>
    ${TABLE(['Step','Time','What you do'],[['1. Part 1: Basics',PLAN.intro,'Start with the question below, write the three goals, teach the Part 1 sections with the board activities'],['2. Quiz 1',PLAN.pre,'10 questions on the basics (students’ copy at the end of the lesson)'],['3. Part 2: Deeper',PLAN.lesson,'Teach the remaining sections with the board activities'],['4. Final quiz',PLAN.post,'10 questions on the whole lesson'],['Close','3 min','Ask each student one thing they learned']])}
    <section class="station"><p class="num">Opening question</p><h2>${esc(I.hook)}</h2><p class="label">Today’s goals</p>${KEY(I.goals.map(esc))}</section></div>
    <div class="partband"><span>Part 1</span> The basics</div>${LP[l.id][0]()}
    <div class="pbreak"><div class="partband"><span>Quiz 1</span> Answer key</div>${printQuiz(Q.q1)}</div>
    <div class="pbreak"><div class="partband"><span>Part 2</span> A deeper look</div></div>${LP[l.id][1]()}
    <div class="pbreak"><div class="partband"><span>Final quiz</span> Answer key</div>${printQuiz(Q.q2)}</div>
    <div class="pbreak"><div class="partband"><span>Student copy</span> ${l.name}: Quiz 1</div><p>Name: ______________________ Roll no: ________ Course/Year: ____________</p>${printQuizStudent(Q.q1)}</div>
    <div class="pbreak"><div class="partband"><span>Student copy</span> ${l.name}: Final quiz</div><p>Name: ______________________ Roll no: ________ Course/Year: ____________</p>${printQuizStudent(Q.q2)}</div>`;
  });
  PRINT=false;
  return h;
}

/* ================= ROUTER ================= */
async function route(){
  const h=(location.hash||'').slice(1);
  clearInterval(clsTimer); clearInterval(tchTimer);
  const navCur=k=>document.querySelectorAll('.navl a').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')==='#'+k?'page':'false'));
  if(h==='class'||h.startsWith('class-')){
    const pl=h.startsWith('class-')&&QUIZ[h.slice(6)]?h.slice(6):null;
    document.body.classList.add('inclass'); navCur(''); document.title='Today’s class · Learn Computing Today';
    enterClass(pl); return;
  }
  document.body.classList.remove('inclass');
  if(h===''&&sb){const a=await fetchActive(); if(a){location.replace('#class');return}}
  let key=h||'home';
  if(key==='results')key='reports';
  const pm=key.match(/^print(?:-(l[1-9]))?$/);
  if(pm){document.body.classList.add('printmode');main.innerHTML=vPrint(pm[1]);document.title='Teacher’s book · Learn Computing Today';return}
  document.body.classList.remove('printmode');
  const qm=key.match(/^quiz([12])-(l[1-9])$/);
  if(qm){main.innerHTML=vQuizPage(qm[2],+qm[1]);initQuizPage(qm[2],+qm[1]);navCur(qm[2]);document.title=(qm[1]==='1'?'Quiz 1':'Final quiz')+' · '+lessonName(qm[2]);window.scrollTo(0,0);return}
  if(LP[key]){main.innerHTML=vLesson(key);LP[key][2]()}
  else if(key==='teacher'){main.innerHTML=vTeacher();initTeacher()}
  else if(key==='reports'){main.innerHTML=vReports();initReports()}
  else{key='home';main.innerHTML=vHome()}
  navCur(key);
  document.title=(key==='home'?'':(LP[key]?lessonName(key):key==='teacher'?'Class control':'Reports')+' · ')+'Learn Computing Today';
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route); route();
})();

</script>
