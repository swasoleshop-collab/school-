/* Layout: one reading column of lesson "stations", each an interactive card; sticky top bar with lesson nav */

@media (prefers-color-scheme: dark){:root{

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:clamp(30px,5vw,46px)} h2{font-size:clamp(23px,3.4vw,30px)} h3{font-size:19px}
p{margin:0}
a{color:var(--teal)}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:18px;color:inherit;text-decoration:none;margin-right:auto}
.navl{display:flex;gap:4px;flex-wrap:wrap}
.navl a{color:inherit;text-decoration:none;font-weight:600;font-size:14px;padding:6px 10px;border-radius:8px;opacity:.8}

main .wrap{padding-block:28px 64px;display:flex;flex-direction:column;gap:22px}
.eyebrow{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.lead{font-size:19px;color:var(--soft);max-width:65ch}
.hero{display:flex;flex-direction:column;gap:12px;padding-block:8px}
.station{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.station .num{font-family:var(--display);font-weight:700;color:var(--accent);font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.cardlink{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;color:inherit;text-decoration:none;transition:transform .15s ease,border-color .15s ease}

.cardlink .tag{align-self:flex-start}
.tag{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--teal-soft);color:var(--teal)}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.warn{background:var(--warn-soft);color:var(--warn)}

.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}

button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--soft)} .small{font-size:14.5px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}

.code .l.hit{background:var(--hl);border-left-color:#F4B183}
.code .l.skip{opacity:.45}
.code .mark{float:right;margin-left:12px;font-weight:700}
.out{font-family:var(--mono);font-size:15px;background:var(--sunk);border-radius:10px;padding:12px 14px;white-space:pre-wrap;min-height:46px}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--sunk);font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft)}
tr:last-child td{border-bottom:0}
tr.new td{animation:rowin .45s ease both}
@keyframes rowin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.bar{display:grid;grid-template-columns:90px 1fr 52px;gap:10px;align-items:center;font-variant-numeric:tabular-nums}

.typed{font-family:var(--display);font-size:24px;font-weight:600;min-height:34px}
.caret{display:inline-block;width:2px;height:1em;background:var(--accent);vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.big{font-family:var(--display);font-weight:700;font-size:clamp(34px,7vw,56px);line-height:1}
.meter{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;width:0;transition:width .4s ease,background .4s ease}
.scam{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--bg)}
.scam .msg{font-size:16.5px}
.q{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.opt input{width:auto;margin-top:4px;accent-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)} .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.score{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px;border-radius:18px;background:var(--ink);color:var(--bg);text-align:center}
.score .big{color:#F4B183}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi b{font-family:var(--display);font-size:28px;display:block;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.next{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.steps{list-style:none;display:flex;gap:6px;padding:0;margin:4px 0 0;flex-wrap:wrap}
.steps li{font-size:13px;font-weight:700;padding:6px 12px;border-radius:99px;background:var(--sunk);color:var(--soft)}
.steps li.cur{background:var(--accent);color:#fff}
.steps li.done{background:var(--good-soft);color:var(--good)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:currentColor;margin-right:6px;animation:blink 1.4s steps(1) infinite}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--soft)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.qbar{display:flex;flex-direction:column;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
body.inclass .navl{display:none}
.sechead{display:flex;gap:14px;align-items:flex-start}
.secnum{font-family:var(--display);font-weight:700;font-size:17px;background:var(--accent);color:#fff;border-radius:10px;min-width:36px;height:36px;display:grid;place-items:center;flex-shrink:0}
.defn{background:var(--teal-soft);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.defn .term{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--teal)}
.note{background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:15.5px}
.exgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.ex{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.ex span{font-size:14.5px;color:var(--soft)}
.flow{display:flex;align-items:stretch;gap:6px}
.flow.wrap{flex-wrap:wrap}
.flow.wrap .fstep{flex:1 1 130px}
.fstep{flex:1;min-width:0;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;background:var(--sunk);animation:rowin .5s ease both}
.fstep span{font-size:14px;color:var(--soft)}
.farrow{align-self:center;font-weight:700;color:var(--soft);font-size:20px}
.c-teal{background:var(--teal-soft)}.c-accent{background:var(--accent-soft)}.c-warn{background:var(--warn-soft)}.c-good{background:var(--good-soft)}.c-bad{background:var(--bad-soft)}
td.wrap{white-space:normal;min-width:110px;vertical-align:top}
.keys{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.try{border:2px dashed var(--accent)}
.keybox{background:var(--ink);color:var(--bg);border:0}
.keybox .num{color:#F4B183}
.partband{display:flex;gap:10px;align-items:center;font-family:var(--display);font-weight:600;font-size:18px;padding:10px 0 0}
.partband span{background:var(--accent);color:#fff;border-radius:8px;padding:4px 10px;font-size:14px}
.label{font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--soft)}
.cm2{color:var(--code-dim)}
.nnline{stroke:var(--line);stroke-width:1.5;stroke-dasharray:6 6;animation:dash 1.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
.nnnode{animation:nnpulse 2s ease-in-out infinite}
@keyframes nnpulse{50%{opacity:.55}}
.layers{display:flex;flex-direction:column;gap:6px}
.layer{background:var(--teal-soft);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;animation:rowin .5s ease both}
.layer span{font-size:14px;color:var(--soft)}
.fchart{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0}
.fc{display:grid;place-items:center;text-align:center;font-weight:700;font-size:14.5px;min-height:44px;padding:8px 18px;color:var(--ink)}
.fc.oval{background:var(--ink);color:var(--bg);border-radius:999px;min-width:120px}
.fc.para{background:var(--teal-soft);transform:skewX(-12deg);min-width:140px}
.fc.para span{display:inline-block;transform:skewX(12deg)}
.fc.diamond{width:110px;height:110px;min-height:0;padding:0;transform:rotate(45deg);background:var(--accent-soft);margin:22px 0}
.fc.diamond span{transform:rotate(-45deg);display:block;width:130px}
.fca{color:var(--soft);font-weight:700}
.fcsplit{display:flex;gap:16px;justify-content:center;text-align:center}
.fcsplit>div{display:flex;flex-direction:column;align-items:center;gap:2px}

@media (max-width:640px){.flow{flex-direction:column}.farrow{transform:rotate(90deg)}.layer{margin-inline:0!important}.two{grid-template-columns:1fr}.station{padding:16px}.bar{grid-template-columns:72px 1fr 46px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(function(){
'use strict';
const CFG=window.SITE_CONFIG||{};
const HAS_DB=!!(window.supabase&&CFG.SUPABASE_URL&&!CFG.SUPABASE_URL.includes('YOUR-PROJECT'));
const sb=HAS_DB?window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY):null;
const main=document.getElementById('main');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.k);toast.k=setTimeout(()=>el.hidden=true,2600)}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const on=(id,ev,fn)=>{const e=$(id);if(e)e.addEventListener(ev,fn)};

/* ---------- teaching building blocks ---------- */
const H=(n,title,sub)=>`<div class="sechead"><span class="secnum">${n}</span><div><h2>${title}</h2>${sub?`<p class="muted">${sub}</p>`:''}</div></div>`;

const FLOW=(steps,cls)=>`<div class="flow ${cls||''}">${steps.map(([t,d,c],i)=>`${i?'<span class="farrow" aria-hidden="true">→</span>':''}<div class="fstep ${c||''}" style="animation-delay:${i*140}ms"><b>${t}</b>${d?`<span>${d}</span>`:''}</div>`).join('')}</div>`;

const TRY=(label,title,inner)=>`<section class="station try"><p class="num">Try it · ${label}</p><h3>${title}</h3>${inner}</section>`;
const SEC=(inner)=>`<section class="station">${inner}</section>`;

/* ---------- lessons and quizzes ---------- */
const LESSONS=[
 {id:'l1',name:'Artificial Intelligence',short:'AI',blurb:'What AI is, how machines learn, and how an AI app like ChatGPT is built.'},
 {id:'l2',name:'Cybersecurity',short:'Cyber',blurb:'Threats, malware, scams, passwords and encryption, with Indian examples.'},
 {id:'l3',name:'Databases & SQL',short:'SQL',blurb:'How apps store data, tables and keys, and real SQL on a chemist shop’s data.'},
 {id:'l4',name:'Python basics',short:'Python',blurb:'Programs, data types, decisions and loops, watched line by line.'}
];
const Qz=(q,o,a,why)=>({q,o,a,why});
const QUIZ={
 l1:{title:'Artificial Intelligence',
  q1:[
   Qz('Artificial Intelligence is best described as…',['A robot body made of metal','Computer systems that do tasks which normally need human intelligence','A very fast internet connection','A new type of keyboard'],1,'AI means machines that learn, reason, understand language or make decisions.'),
   Qz('Who first used the term “Artificial Intelligence”, in 1956?',['Bill Gates','John McCarthy','Elon Musk','Steve Jobs'],1,'John McCarthy named the field at the Dartmouth conference in 1956.'),
   Qz('Which everyday app uses AI to predict traffic and arrival time?',['Calculator','Google Maps','Torch','Clock'],1,'Google Maps learns from live and past travel data to predict traffic.'),
   Qz('All the AI we use today (ChatGPT, face unlock, Maps) is…',['General AI','Super AI','Narrow AI','Human AI'],2,'Narrow AI is very good at one kind of task. General AI does not exist yet.'),
   Qz('Machine Learning is…',['A part of AI where computers learn from data','Bigger than AI','A computer chip','A programming language'],0,'Machine Learning sits inside AI: the computer learns patterns from examples.'),
   Qz('In machine learning, what do we give the computer?',['Only the rules','Data with answers, so it can find the rules','Only a password','Nothing'],1,'Normal programs get rules from us; ML finds the rules from data and answers.'),
   Qz('Face unlock on a phone uses…',['Deep Learning','A spreadsheet','A calculator','Bluetooth'],0,'Face recognition uses many-layer neural networks: Deep Learning.'),
   Qz('Which order shows how an AI system works?',['Data → Training → Model → Prediction','Prediction → Data → Model → Training','Model → Typing → Printing → Data','Internet → Charging → Output → Data'],0,'We collect data, train on it, get a model, then use the model to predict.'),
   Qz('YouTube suggesting your next video is an example of…',['AI predicting what you may like','A computer virus','A broken database','Staff choosing videos by hand'],0,'A recommendation system learns from what you and similar viewers watched.'),
   Qz('ChatGPT and AI image makers belong to…',['Generative AI','Calculators','Antivirus software','Hardware'],0,'Generative AI creates new text, images, music or code.')],
  q2:[
   Qz('Learning from examples that already have the right answer (spam / not spam) is…',['Supervised learning','Unsupervised learning','Reinforcement learning','No learning'],0,'Labelled examples mean supervised learning.'),
   Qz('Grouping shoppers with similar habits, with no labels given, is…',['Supervised learning','Unsupervised learning','Reinforcement learning','Typing'],1,'Unsupervised learning finds groups on its own.'),
   Qz('A robot learning to walk by reward and penalty uses…',['Reinforcement learning','Supervised learning','A database','HTML'],0,'Reinforcement learning improves by trial, reward and penalty.'),
   Qz('In a neural network, the layers between input and output are called…',['Hidden layers','Front layers','Cloud layers','Key layers'],0,'Input layer → hidden layers → output layer.'),
   Qz('Using a trained model to answer a new question is called…',['Training','Inference (prediction)','Coding','Charging'],1,'Training builds the model; inference uses it.'),
   Qz('In the ChatGPT app, the chat box and buttons you see are the…',['Back end','Front end','Database','Data centre'],1,'The front end is the part the user sees and touches.'),
   Qz('The server part that checks your login and sends your message to the model is the…',['Front end','Back end','Keyboard','Screen'],1,'The back end works behind the scenes on servers.'),

function neuralSVG(){
  const layers=[3,4,4,2], X=[70,210,350,490], H=260;
  const pos=layers.map((n,li)=>Array.from({length:n},(_,i)=>[X[li],(H/(n+1))*(i+1)+10]));
  let lines='';
  for(let l=0;l<layers.length-1;l++)pos[l].forEach(a=>pos[l+1].forEach(b=>{lines+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" class="nnline" style="animation-delay:${l*0.5}s"/>`}));
  const cols=['var(--teal)','var(--accent)','var(--accent)','var(--good)'];
  const nodes=pos.map((ps,l)=>ps.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="17" fill="${cols[l]}" class="nnnode" style="animation-delay:${l*0.5}s"/>`).join('')).join('');
  const lab=['Input layer','Hidden layer 1','Hidden layer 2','Output layer'].map((t,i)=>`<text x="${X[i]}" y="${H+40}" font-size="14" font-weight="700" text-anchor="middle" fill="var(--soft)">${t}</text>`).join('');
  const inl=['Pixels','Shape','Colour'].map((t,i)=>`<text x="${X[0]-28}" y="${pos[0][i][1]+5}" font-size="13" text-anchor="end" fill="var(--soft)">${t}</text>`).join('');
  const outl=['Cat 92%','Dog 8%'].map((t,i)=>`<text x="${X[3]+28}" y="${pos[3][i][1]+5}" font-size="13" font-weight="700" fill="var(--ink)">${t}</text>`).join('');
  return `<svg viewBox="-30 0 620 ${H+56}" role="img" aria-label="Neural network diagram: input layer, two hidden layers and an output layer, with every node connected to the next layer" style="width:100%">${lines}${nodes}${lab}${inl}${outl}</svg>`;
}

const TRAIN=[{h:1,a:50,r:'Fail'},{h:2,a:60,r:'Fail'},{h:4,a:80,r:'Pass'},{h:6,a:90,r:'Pass'}];
function drawPlot(){
  if(!$('plot'))return;
  const h=+$('hrs').value,a=+$('att').value; $('hv').textContent=h; $('av').textContent=a;
  const X=v=>50+v/8*440, Y=v=>260-(v-40)/60*230, dist=t=>Math.hypot((t.h-h)/8,(t.a-a)/60);
  const near=TRAIN.reduce((b,t)=>dist(t)<dist(b)?t:b,TRAIN[0]);
  let s=`<line x1="50" y1="260" x2="490" y2="260" stroke="var(--line)"/><line x1="50" y1="30" x2="50" y2="260" stroke="var(--line)"/>`;
  for(let v=0;v<=8;v+=2)s+=`<text x="${X(v)}" y="282" font-size="13" text-anchor="middle" fill="var(--soft)">${v}h</text>`;
  for(let v=40;v<=100;v+=20)s+=`<text x="42" y="${Y(v)+4}" font-size="13" text-anchor="end" fill="var(--soft)">${v}%</text>`;

function crack(pw){
  if(!pw)return null; let cs=0;
  if(/[a-z]/.test(pw))cs+=26; if(/[A-Z]/.test(pw))cs+=26; if(/[0-9]/.test(pw))cs+=10; if(/[^a-zA-Z0-9]/.test(pw))cs+=33;
  const log10=pw.length*Math.log10(cs); return {secs:Math.pow(10,log10-10)/2,cs,len:pw.length,log10};
}
function human(s){
  if(s<1)return 'Instantly'; if(s<60)return Math.round(s)+' seconds'; if(s<3600)return Math.round(s/60)+' minutes'; if(s<86400)return Math.round(s/3600)+' hours';
  if(s<31557600)return Math.round(s/86400)+' days'; const y=s/31557600;
  if(y<1e3)return Math.round(y)+' years'; if(y<1e6)return Math.round(y/1e3)+' thousand years'; if(y<1e9)return (y/1e6).toFixed(1)+' million years'; return 'Billions of years';
}

const MEDS=[[1,'Paracetamol 650','B101','2027-08-31',120,2.10],[2,'Amoxicillin 500','A220','2026-12-31',15,8.50],[3,'Cetirizine 10','C330','2027-03-31',60,1.80],[4,'Pantoprazole 40','P440','2027-01-15',8,6.00],[5,'ORS sachet','O550','2028-02-28',200,21.00]];
const SALES=[[101,1,'2026-11-10',10],[102,2,'2026-11-10',3],[103,1,'2026-11-11',6],[104,5,'2026-11-12',20],[105,4,'2026-11-12',2]];
const PRESETS=[
 ['See everything','SELECT * FROM medicines;'],
 ['Low stock','SELECT name, qty FROM medicines WHERE qty < 20;'],
 ['Expiring soon',"SELECT name, expiry FROM medicines\nWHERE expiry < '2027-03-31'\nORDER BY expiry;"],
 ['Price above ₹5','SELECT name, price FROM medicines WHERE price > 5;'],
 ['Most expensive first','SELECT name, price FROM medicines ORDER BY price DESC;'],
 ['Count','SELECT COUNT(*) FROM medicines;'],
 ['Stock value','SELECT SUM(qty * price) AS stock_value FROM medicines;'],
 ['Average price','SELECT AVG(price) AS avg_price FROM medicines;'],
 ['Cheapest and dearest','SELECT MIN(price), MAX(price) FROM medicines;'],
 ['Sold per medicine (JOIN + GROUP BY)','SELECT m.name, SUM(s.qty) AS sold\nFROM sales s JOIN medicines m ON s.med_id = m.med_id\nGROUP BY m.name;']
];
function presetResult(sql){
  const n=sql.replace(/\s+/g,' ').trim().toLowerCase(), P=PRESETS.map(p=>p[1].replace(/\s+/g,' ').trim().toLowerCase()), i=P.indexOf(n);
  const cols=['med_id','name','batch','expiry','qty','price'];
  switch(i){
    case 0:return{columns:cols,values:MEDS};
    case 1:return{columns:['name','qty'],values:MEDS.filter(m=>m[4]<20).map(m=>[m[1],m[4]])};
    case 2:return{columns:['name','expiry'],values:MEDS.filter(m=>m[3]<'2027-03-31').sort((a,b)=>a[3].localeCompare(b[3])).map(m=>[m[1],m[3]])};
    case 3:return{columns:['name','price'],values:MEDS.filter(m=>m[5]>5).map(m=>[m[1],m[5]])};
    case 4:return{columns:['name','price'],values:[...MEDS].sort((a,b)=>b[5]-a[5]).map(m=>[m[1],m[5]])};
    case 5:return{columns:['COUNT(*)'],values:[[MEDS.length]]};
    case 6:return{columns:['stock_value'],values:[[MEDS.reduce((s,m)=>s+m[4]*m[5],0)]]};
    case 7:return{columns:['avg_price'],values:[[MEDS.reduce((s,m)=>s+m[5],0)/MEDS.length]]};
    case 8:return{columns:['MIN(price)','MAX(price)'],values:[[Math.min(...MEDS.map(m=>m[5])),Math.max(...MEDS.map(m=>m[5]))]]};
    case 9:{const t={};SALES.forEach(s=>{const nm=MEDS.find(m=>m[0]===s[1])[1];t[nm]=(t[nm]||0)+s[3]});return{columns:['name','sold'],values:Object.keys(t).sort().map(k=>[k,t[k]])}}
  }
  return null;
}
let SQLDB=null, sqlState='loading';
async function loadSQL(){

      const SQL=await window.initSqlJs({locateFile:f=>'https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/'+f});
      SQLDB=new SQL.Database();
      SQLDB.run(`CREATE TABLE medicines(med_id INT PRIMARY KEY, name TEXT NOT NULL, batch TEXT, expiry TEXT, qty INT CHECK(qty>=0), price REAL);
        CREATE TABLE sales(sale_id INT PRIMARY KEY, med_id INT REFERENCES medicines(med_id), sale_date TEXT, qty INT);`);
      const st=SQLDB.prepare('INSERT INTO medicines VALUES (?,?,?,?,?,?)');MEDS.forEach(r=>st.run(r));st.free();
      const s2=SQLDB.prepare('INSERT INTO sales VALUES (?,?,?,?)');SALES.forEach(r=>s2.run(r));s2.free();
      sqlState='ready';
    }catch(e){sqlState='failed'}
  }
  const el=$('sqlstate'); if(el)el.innerHTML=sqlState==='ready'?'<span class="tag good">Live SQL engine ready: type any SELECT query</span>':'<span class="tag warn">Offline mode: the example buttons still work</span>';

function tableHtml(res){
  if(!res||!res.columns)return '<p class="muted">The query ran. It returned no rows.</p>';
  const fmt=v=>typeof v==='number'&&!Number.isInteger(v)?v.toFixed(2):v;
  return `<div class="tablebox"><table><tr>${res.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${res.values.map((r,i)=>`<tr class="new" style="animation-delay:${i*90}ms">${r.map(v=>`<td>${esc(fmt(v))}</td>`).join('')}</tr>`).join('')}</table></div><p class="small muted">${res.values.length} row${res.values.length===1?'':'s'}</p>`;
}
function runSQL(){
  const sql=$('sqlin').value.trim(), out=$('sqlout');
  if(!sql){out.innerHTML='<p class="feedback bad">Type a query first.</p>';return}
  if(SQLDB){
    if(/\b(drop|delete|update|insert|alter|create)\b/i.test(sql)){out.innerHTML='<p class="feedback info">In this practice table only SELECT queries are allowed, so everyone sees the same data.</p>';return}
    try{const r=SQLDB.exec(sql); out.innerHTML=tableHtml(r[r.length-1])}catch(e){out.innerHTML=`<p class="feedback bad">SQL error: ${esc(e.message)}. Check spelling, commas and the semicolon.</p>`}
  }else{const r=presetResult(sql); out.innerHTML=r?tableHtml(r):'<p class="feedback info">Offline mode can only run the example buttons. Connect to the internet to type your own query.</p>'}
}

function qbRun(){
  if(!$('qb-sql'))return;
  const cols=$('qb-cols').value, w=$('qb-where').value, o=$('qb-order').value;
  const sql=`SELECT ${cols} FROM medicines${w?' WHERE '+w:''}${o?' ORDER BY '+o:''};`;
  $('qb-sql').textContent=sql;
  const idx={med_id:0,name:1,batch:2,expiry:3,qty:4,price:5};
  const test={'':()=>true,'qty < 20':m=>m[4]<20,'price > 5':m=>m[5]>5,"expiry < '2027-03-31'":m=>m[3]<'2027-03-31','qty BETWEEN 10 AND 100':m=>m[4]>=10&&m[4]<=100}[w];
  let rows=MEDS.filter(test);
  if(o){const [c,d]=o.split(' '),k=idx[c];rows=[...rows].sort((a,b)=>(a[k]>b[k]?1:a[k]<b[k]?-1:0)*(d==='DESC'?-1:1))}
  const cs=cols==='*'?Object.keys(idx):cols.split(', ');
  $('qb-out').innerHTML=tableHtml({columns:cs,values:rows.map(m=>cs.map(c=>m[idx[c]]))});
}

function pyType(v){
  v=v.trim(); if(!v)return null;
  if(/^(["']).*\1$/.test(v))return ['str','Anything inside quotes is text (str).'];
  if(/^-?\d+$/.test(v))return ['int','A whole number is an int.'];
  if(/^-?(\d+\.\d*|\.\d+)$/.test(v))return ['float','A number with a decimal point is a float.'];
  if(v==='True'||v==='False')return ['bool','True and False (capital letter, no quotes) are bool.'];
  if(v==='true'||v==='false')return [null,'Python is case-sensitive: write True or False with a capital letter.'];
  return [null,'In Python, text needs quotes, like "'+v+'".'];
}

  await hit(0); mark(0,'marks = '+m,true); L[0].classList.remove('hit');
  let printed=null;
  for(const [ci,ok,pi,txt] of [[1,m>=75,2,'Grade A'],[3,m>=60,4,'Grade B'],[5,m>=33,6,'Grade C - Pass']]){
    await hit(ci); mark(ci,ok?'True':'False',ok);
    if(ok){L[ci].classList.remove('hit');await hit(pi);printed=txt;break}
    L[ci].classList.remove('hit'); L[pi].classList.add('skip');
  }
  if(!printed){await hit(7);L[7].classList.remove('hit');await hit(8);printed='Fail'}
  for(let i=1;i<L.length;i++)if(!L[i].classList.contains('hit')&&!L[i].querySelector('.mark'))L[i].classList.add('skip');
  $('gout').textContent=printed; btn.disabled=false; btn.textContent='Run again';
}
function updBill(){
  const p=Number($('bp').value)||0,q=Math.floor(Number($('bq').value)||0); let bill=p*q; const disc=bill>500;
  const L=[...document.querySelectorAll('#bcode .l')]; L.forEach(l=>{l.className='l';const k=l.querySelector('.mark');if(k)k.remove()});
  const mark=(i,t,c)=>{const s=document.createElement('span');s.className='mark';s.style.color=c||'#F4B183';s.textContent=t;L[i].appendChild(s)};
  mark(0,'price = '+p); mark(1,'qty = '+q); mark(2,'bill = '+(+(p*q).toFixed(2))); mark(3,disc?'True':'False',disc?'#8FE0A8':'#F38A7E');
  if(disc){bill=bill-bill*0.10;L[4].classList.add('hit');mark(4,'bill = '+(+bill.toFixed(2)))}else L[4].classList.add('skip');
  $('bout').textContent='Amount to pay: '+(Number.isInteger(bill)?bill.toFixed(1):String(+bill.toFixed(2)))+(disc?'   (10% discount applied)':'   (no discount)');
}
function updLoop(){const n=Number($('ln').value);if(!Number.isFinite(n)){$('lout').textContent='';return}$('lout').textContent=Array.from({length:10},(_,i)=>`${n} x ${i+1} = ${n*(i+1)}`).join('\n')}

      <p class="small muted">Suggested timing for 40 minutes: Part 1 (12 min) → Quiz 1 (5 min) → Part 2 (15 min) → Final quiz (5 min).</p>
      <button class="btn primary" type="submit">Start class</button></form>
      <div class="row"><a class="btn" href="#reports">Open reports</a><button class="btn" id="tsignout">Sign out</button></div>`;
    on('tstart','submit',async e=>{e.preventDefault();
      await sb.from('class_sessions').update({active:false,stage:'closed',ended_at:new Date().toISOString()}).eq('active',true);
      const {error}=await sb.from('class_sessions').insert({lesson:$('tl').value,label:$('tlab').value.trim(),stage:'intro',active:true}).select().single();
      if(error){toast('Could not start: '+error.message);return} toast('Class started'); loadTeacher()});
    on('tsignout','click',async()=>{await sb.auth.signOut();initTeacher()});
    return;
  }
  const order=['intro','pre','lesson','post'];
  el.innerHTML=`<section class="station"><div class="row" style="justify-content:space-between"><div><p class="num">Live now</p><h2>${esc(lessonName(TCH.lesson))}</h2><p class="muted small">${esc(TCH.label||'')} · started ${esc(new Date(TCH.created_at).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}))}</p></div><span class="tag good">Now: ${STAGE_NAME[TCH.stage]}</span></div>
    <p class="small muted">Tap the step the class should see now:</p>
    <div class="row">${order.map((s,i)=>`<button class="btn ${TCH.stage===s?'on':''}" data-stage="${s}">${i+1}. ${STAGE_NAME[s]}</button>`).join('')}</div>
    <div class="row">${confirmEnd?`<span class="small">End this class? Students can no longer submit.</span><button class="btn primary" id="tendy">Yes, end class</button><button class="btn" id="tendn">Keep it running</button>`:`<button class="btn" id="tend">End class</button>`}<a class="btn" href="#${TCH.lesson}" target="_blank" rel="noopener">Open lesson to teach from</a><a class="btn" href="#reports">Reports</a></div></section>
  <div class="two"><section class="station"><p class="num">Students open</p><p style="font-family:var(--mono);word-break:break-all;font-size:15px;user-select:all">${esc(siteLink())}</p><div id="qr" style="align-self:flex-start;background:#fff;padding:10px;border-radius:12px"></div></section>
  <section class="station" id="live"><p class="muted">Loading live results…</p></section></div>`;
  document.querySelectorAll('[data-stage]').forEach(b=>b.addEventListener('click',async()=>{
    const {data,error}=await sb.from('class_sessions').update({stage:b.dataset.stage}).eq('id',TCH.id).select().single();
    if(error){toast(error.message);return} TCH=data; renderTeacher(); toast('Students now see: '+STAGE_NAME[TCH.stage])}));
  on('tend','click',()=>{confirmEnd=true;renderTeacher()});
  on('tendn','click',()=>{confirmEnd=false;renderTeacher()});
  on('tendy','click',async()=>{await sb.from('class_sessions').update({active:false,stage:'closed',ended_at:new Date().toISOString()}).eq('id',TCH.id);clearInterval(tchTimer);toast('Class ended');location.hash='#reports'});
  try{if(window.QRCode)new QRCode($('qr'),{text:siteLink(),width:200,height:200})}catch(e){}
  liveCounts();
}
async function liveCounts(){
  if(!TCH||!$('live'))return;
  const {data}=await sb.from('quiz_results').select('*').eq('session_id',TCH.id);
  const by={}; (data||[]).forEach(r=>{(by[r.student_key]=by[r.student_key]||{name:r.student_name})[r.phase]=r.score});
  const st=Object.values(by), pre=st.filter(s=>s.pre!=null), post=st.filter(s=>s.post!=null);
  const avg=(a,n)=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length/n*100)+'%':'–';
  $('live').innerHTML=`<p class="num">Live results</p><div class="kpis"><div class="kpi"><b>${pre.length}</b><span class="small muted">Quiz 1 done · avg ${avg(pre.map(s=>s.pre),QUIZ[TCH.lesson].q1.length)}</span></div><div class="kpi"><b>${post.length}</b><span class="small muted">Final quiz done · avg ${avg(post.map(s=>s.post),QUIZ[TCH.lesson].q2.length)}</span></div></div>
  <div class="tablebox"><table><tr><th>Student</th><th>Quiz 1</th><th>Final</th></tr>${st.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.pre??'–'}</td><td>${s.post??'–'}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">Waiting for students…</td></tr>'}</table></div><p class="small muted">Updates every 5 seconds.</p>`;
}

let REP={sessions:[],results:[],sel:null};
function vReports(){return `<section class="hero"><p class="eyebrow">Reports</p><h1>Learning reports</h1><p class="lead">Quiz 1 (the basics) and the final quiz (the whole lesson), for every class and every student.</p></section><div id="rbody"><p class="muted">Loading…</p></div>`}
function initReports(){requireStaff($('rbody'),loadReports)}
async function loadReports(){
  const [s,r]=await Promise.all([sb.from('class_sessions').select('*').order('created_at',{ascending:false}).limit(300),sb.from('quiz_results').select('*').order('created_at',{ascending:true}).limit(10000)]);
  if(s.error||r.error){$('rbody').innerHTML=`<p class="feedback bad">${esc((s.error||r.error).message)}</p>`;return}
  REP.sessions=s.data||[]; REP.results=(r.data||[]).filter(x=>x.session_id);
  if(REP.sel&&!REP.sessions.find(x=>x.id===REP.sel))REP.sel=null;
  renderReports();
}
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function sessionStats(sid){
  const ses=REP.sessions.find(x=>x.id===sid), Q=QUIZ[ses.lesson], by={};
  REP.results.filter(r=>r.session_id===sid).forEach(r=>{const s=by[r.student_key]=by[r.student_key]||{name:r.student_name,roll:r.roll_no,course:r.course,year:r.year};s[r.phase]=r.score;s[r.phase+'Ans']=r.answers});
  const st=Object.values(by);
  const preAvg=mean(st.filter(s=>s.pre!=null).map(s=>s.pre/Q.q1.length*100)), postAvg=mean(st.filter(s=>s.post!=null).map(s=>s.post/Q.q2.length*100));
  const rate=(qs,key)=>qs.map((q,i)=>{const g=st.filter(s=>Array.isArray(s[key]));return g.length?Math.round(g.filter(s=>s[key][i]===q.a).length/g.length*100):null});
  const strong=st.filter(s=>s.post!=null&&s.post/Q.q2.length>=0.7).length, finished=st.filter(s=>s.post!=null).length;
  return {ses,Q,st,preAvg,postAvg,q1rate:rate(Q.q1,'preAns'),q2rate:rate(Q.q2,'postAns'),strong,finished};
}
const pc=v=>v==null?'–':Math.round(v)+'%';
const rateColor=p=>p==null?'var(--line)':p<50?'var(--bad)':p<75?'var(--warn)':'var(--good)';
function rateBars(qs,rates){return `<div class="bars">${qs.map((q,i)=>`<div class="qbar"><p class="small"><b>Q${i+1}.</b> ${esc(q.q)}</p><div class="bar" style="grid-template-columns:1fr 52px"><div class="track"><div class="fillbar" style="width:${rates[i]??0}%;background:${rateColor(rates[i])}"></div></div><span>${pc(rates[i])}</span></div></div>`).join('')}</div>`}
function renderReports(){
  const el=$('rbody'); if(!el)return;
  const sesList=REP.sessions.filter(s=>REP.results.some(r=>r.session_id===s.id)||s.active);
  let html=`<div class="row"><button class="btn" id="rref">Refresh</button><a class="btn" href="#teacher">Class control</a><button class="btn" id="rout">Sign out</button></div>
  <section class="station"><h2>All classes</h2><div class="tablebox"><table><tr><th>Date</th><th>Class</th><th>Lesson</th><th>Students</th><th>Quiz 1</th><th>Final quiz</th><th></th></tr>
  ${sesList.map(s=>{const k=sessionStats(s.id);return `<tr><td>${esc(new Date(s.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short'}))}</td><td>${esc(s.label||'–')}${s.active?' <span class="tag good">live</span>':''}</td><td>${esc((LESSONS.find(l=>l.id===s.lesson)||{}).short)}</td><td>${k.st.length}</td><td>${pc(k.preAvg)}</td><td>${pc(k.postAvg)}</td><td><button class="btn" data-rsel="${s.id}" style="min-height:36px;padding:6px 12px">View</button></td></tr>`}).join('')||'<tr><td colspan="7" class="muted">No classes yet. Start one from Class control.</td></tr>'}
  </table></div></section>`;
  if(REP.sel){
    const k=sessionStats(REP.sel);
    html+=`<section class="station" id="rdetail"><p class="num">${esc(new Date(k.ses.created_at).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}))}</p><h2>${esc(k.ses.label||'Class')} · ${esc(lessonName(k.ses.lesson))}</h2>
    <div class="kpis"><div class="kpi"><b>${k.st.length}</b><span class="small muted">Students joined</span></div><div class="kpi"><b>${pc(k.preAvg)}</b><span class="small muted">Average, Quiz 1 (basics)</span></div><div class="kpi"><b>${pc(k.postAvg)}</b><span class="small muted">Average, final quiz</span></div><div class="kpi"><b>${k.finished?Math.round(k.strong/k.finished*100)+'%':'–'}</b><span class="small muted">Scored 70%+ in the final quiz</span></div></div>
    <div class="two"><div><h3>Quiz 1: correct answers per question</h3>${rateBars(k.Q.q1,k.q1rate)}</div><div><h3>Final quiz: correct answers per question</h3>${rateBars(k.Q.q2,k.q2rate)}</div></div>
    <p class="small muted">Red bars show topics to revise in the next class.</p>
    <h3>Students</h3><div class="tablebox"><table><tr><th>Name</th><th>Roll</th><th>Course</th><th>Quiz 1</th><th>Final quiz</th><th>Total</th></tr>
    ${k.st.sort((a,b)=>a.name.localeCompare(b.name)).map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.roll)}</td><td>${esc(s.course)} ${s.year?'· Y'+s.year:''}</td><td>${s.pre??'–'} / ${k.Q.q1.length}</td><td>${s.post??'–'} / ${k.Q.q2.length}</td><td><b>${(s.pre??0)+(s.post??0)}</b> / ${k.Q.q1.length+k.Q.q2.length}</td></tr>`).join('')}
    </table></div><div class="row"><button class="btn primary" id="rcsv">Download CSV</button></div></section>`;
  }
  el.innerHTML=html;
  on('rref','click',loadReports);
  on('rout','click',async()=>{await sb.auth.signOut();initReports()});
  document.querySelectorAll('[data-rsel]').forEach(b=>b.addEventListener('click',()=>{REP.sel=b.dataset.rsel;renderReports();$('rdetail').scrollIntoView({behavior:'smooth'})}));
  on('rcsv','click',()=>{
    const k=sessionStats(REP.sel);
    const rows=[['class','lesson','date','name','roll','course','year','quiz1','quiz1_out_of','final','final_out_of'],...k.st.map(s=>[k.ses.label,lessonName(k.ses.lesson),k.ses.created_at,s.name,s.roll,s.course,s.year,s.pre??'',k.Q.q1.length,s.post??'',k.Q.q2.length])];
    const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='class-report.csv';a.click();
  });
}

/* ================= ROUTER ================= */
async function route(){
  const h=(location.hash||'').slice(1);
  clearInterval(clsTimer); clearInterval(tchTimer);
  const navCur=k=>document.querySelectorAll('.navl a').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')==='#'+k?'page':'false'));
  if(h==='class'||h.startsWith('class-')){
    const pl=h.startsWith('class-')&&QUIZ[h.slice(6)]?h.slice(6):null;
    document.body.classList.add('inclass'); navCur(''); document.title='Today’s class · Learn Computing Today';
    enterClass(pl); return;
  }
  document.body.classList.remove('inclass');
  if(h===''&&sb){const a=await fetchActive(); if(a){location.replace('#class');return}}
  let key=h||'home';
  if(key==='results')key='reports';
  const qm=key.match(/^quiz([12])-(l[1-4])$/);
  if(qm){main.innerHTML=vQuizPage(qm[2],+qm[1]);initQuizPage(qm[2],+qm[1]);navCur(qm[2]);document.title=(qm[1]==='1'?'Quiz 1':'Final quiz')+' · '+lessonName(qm[2]);window.scrollTo(0,0);return}
  if(LP[key]){main.innerHTML=vLesson(key);LP[key][2]()}
  else if(key==='teacher'){main.innerHTML=vTeacher();initTeacher()}
  else if(key==='reports'){main.innerHTML=vReports();initReports()}
  else{key='home';main.innerHTML=vHome()}
  navCur(key);
  document.title=(key==='home'?'':(LP[key]?lessonName(key):key==='teacher'?'Class control':'Reports')+' · ')+'Learn Computing Today';
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route); route();
})();

</script>
</body>
</html>
